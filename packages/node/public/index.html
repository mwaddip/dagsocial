<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DAGsocial Demo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #0d1117; color: #c9d1d9; display: flex; height: 100vh; }
  .panel { padding: 20px; overflow-y: auto; }
  .left { width: 420px; min-width: 420px; border-right: 1px solid #30363d; display: flex; flex-direction: column; gap: 16px; }
  .right { flex: 1; }
  h2 { font-size: 14px; text-transform: uppercase; letter-spacing: 1px; color: #8b949e; margin-bottom: 8px; }
  h3 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: #6e7681; margin: 8px 0 4px; }
  h4 { font-size: 11px; color: #8b949e; margin: 6px 0 2px; }
  textarea, input, select { width: 100%; background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 10px; color: #c9d1d9; font-size: 13px; font-family: inherit; }
  textarea { height: 120px; resize: vertical; }
  input, select { height: 36px; }
  select { cursor: pointer; }
  button { background: #238636; color: #fff; border: none; border-radius: 6px; padding: 8px 16px; font-size: 13px; cursor: pointer; font-weight: 500; }
  button:hover { background: #2ea043; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button.small { padding: 4px 10px; font-size: 11px; }
  button.danger { background: #da3633; }
  button.danger:hover { background: #f85149; }
  .id-badge { font-size: 11px; color: #58a6ff; font-family: monospace; word-break: break-all; background: #161b22; padding: 8px; border-radius: 6px; border: 1px solid #30363d; }
  .post { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 12px; margin-bottom: 10px; }
  .post-author { font-size: 11px; color: #58a6ff; font-family: monospace; margin-bottom: 6px; }
  .post-content { font-size: 14px; line-height: 1.5; }
  .post-meta { font-size: 11px; color: #484f58; margin-top: 8px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .status { font-size: 11px; padding: 4px 8px; border-radius: 10px; }
  .status-ok { background: #163b23; color: #3fb950; }
  .status-busy { background: #3b2816; color: #d29922; }
  .status-error { background: #3b1616; color: #f85149; }
  .empty { color: #484f58; font-style: italic; padding: 20px; text-align: center; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row label { font-size: 12px; color: #8b949e; min-width: 0; white-space: nowrap; }
  .like-btn { background: none; border: 1px solid #30363d; border-radius: 4px; color: #8b949e; cursor: pointer; font-size: 12px; padding: 2px 8px; }
  .like-btn:hover { border-color: #f85149; color: #f85149; background: #3b1616; }
  .like-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .like-btn.liked { border-color: #f85149; color: #f85149; background: #2d1216; }
  .status-bar { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 10px; font-size: 12px; line-height: 1.6; }
  .status-bar span { color: #8b949e; }
  .status-bar strong { color: #c9d1d9; }
  pre { background: #0d1117; border: 1px solid #30363d; border-radius: 4px; padding: 8px; font-size: 11px; font-family: monospace; color: #7ee787; overflow-x: auto; white-space: pre-wrap; word-break: break-all; margin: 4px 0; }
  .result-msg { font-size: 11px; padding: 4px 0; color: #8b949e; }
  .result-msg.ok { color: #3fb950; }
  .result-msg.err { color: #f85149; }
  hr { border: none; border-top: 1px solid #21262d; margin: 8px 0; }
</style>
</head>
<body>

<div class="panel left">
  <h2>Identity</h2>
  <div class="row">
    <select id="identitySelect"></select>
  </div>
  <div class="row">
    <button id="newIdentityBtn" class="small">+ New</button>
    <button id="importIdentityBtn" class="small">Import</button>
    <button id="exportIdentityBtn" class="small">Export</button>
  </div>
  <input type="file" id="importFileInput" accept=".json" style="display:none">
  <div class="id-badge" id="currentUserId">loading...</div>

  <h2>Compose</h2>
  <textarea id="content" placeholder="What's on your mind?"></textarea>
  <input id="parents" placeholder="Parent post IDs (comma-separated, optional)">
  <div class="row">
    <button id="postBtn" disabled>Post</button>
    <span class="status" id="postStatus"></span>
  </div>

  <h2>Node Status</h2>
  <div class="status-bar" id="statusBar">Loading...</div>

  <div id="adminSection" style="display:none">
    <hr>
    <h2>Admin / Debug</h2>

    <h3>Faucet</h3>
    <div class="row">
      <input id="faucetAmount" type="number" value="100" min="1" max="1000" style="width:100px">
      <button id="faucetBtn" class="small">Grant</button>
    </div>
    <div id="faucetResult"></div>

    <h3>Invites</h3>
    <h4>Create</h4>
    <div class="row">
      <label>Karma:</label>
      <input id="inviteKarma" type="number" value="10" min="1" style="width:70px">
      <label>Bond:</label>
      <input id="inviteBond" type="number" value="5" min="1" style="width:70px">
      <button id="createInviteBtn" class="small">Create</button>
    </div>
    <div id="inviteResult"></div>

    <h4>Redeem</h4>
    <div class="row">
      <input id="inviteBoxIdInput" placeholder="Invite Box ID" style="flex:1;font-size:11px">
    </div>
    <div class="row" style="margin-top:4px">
      <input id="inviteSecretInput" placeholder="Secret (hex)" style="flex:1;font-size:11px">
      <button id="redeemInviteBtn" class="small">Redeem</button>
    </div>
    <div id="redeemResult"></div>
  </div>
</div>

<div class="panel right">
  <h2>Feed</h2>
  <div id="feed"><div class="empty">Loading...</div></div>
</div>

<script type="module">
import { blake2b } from 'https://cdn.jsdelivr.net/npm/blakejs@1.2.1/+esm';

const API = '';
const encoder = new TextEncoder();

// ---------------------------------------------------------------------------
// State
// ---------------------------------------------------------------------------

const STORAGE_KEY = 'dagsocial-identities';
let identities = [];           // [{ pubKeyHex, privKeyBase64 }]
let activeIndex = -1;
let userId, pubKeyRaw, privKey;
let networkMode = 'mainnet';
const likedPosts = new Set();

// ---------------------------------------------------------------------------
// Hex / byte utilities
// ---------------------------------------------------------------------------

function buf2hex(buf) {
  return [...buf].map(b => b.toString(16).padStart(2, '0')).join('');
}

function hex2buf(hex) {
  const bytes = new Uint8Array(hex.length / 2);
  for (let i = 0; i < hex.length; i += 2) {
    bytes[i / 2] = parseInt(hex.substring(i, i + 2), 16);
  }
  return bytes;
}

function concatUint8Arrays(arrays) {
  const totalLength = arrays.reduce((s, a) => s + a.length, 0);
  const result = new Uint8Array(totalLength);
  let offset = 0;
  for (const a of arrays) {
    result.set(a, offset);
    offset += a.length;
  }
  return result;
}

function encodeLE64(n) {
  const buf = new ArrayBuffer(8);
  new DataView(buf).setBigUint64(0, BigInt(n), true);
  return new Uint8Array(buf);
}

// ---------------------------------------------------------------------------
// Base58
// ---------------------------------------------------------------------------

const B58 = '123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';
const B58MAP = {}; for (let i = 0; i < 58; i++) B58MAP[B58[i]] = i;

function base58Encode(buf) {
  let zeros = 0; for (const b of buf) { if (b !== 0) break; zeros++; }
  const digits = [0];
  for (const b of buf) {
    let carry = b;
    for (let i = 0; i < digits.length; i++) { carry += digits[i] * 256; digits[i] = carry % 58; carry = Math.floor(carry / 58); }
    while (carry > 0) { digits.push(carry % 58); carry = Math.floor(carry / 58); }
  }
  return '1'.repeat(zeros) + digits.reverse().map(d => B58[d]).join('');
}

// ---------------------------------------------------------------------------
// PoW
// ---------------------------------------------------------------------------

function countLeadingZeroBits(buf) {
  let bits = 0;
  for (let i = 0; i < buf.length; i++) {
    if (buf[i] === 0) { bits += 8; continue; }
    let mask = 0x80;
    while ((buf[i] & mask) === 0) { bits++; mask >>= 1; }
    break;
  }
  return bits;
}

function buildPowInput(content, author, parentRefs, challengeBytes, protocolVersion, timestamp) {
  const parts = [
    encoder.encode(content),
    encoder.encode(author),
    ...parentRefs.map(r => encoder.encode(r)),
    challengeBytes,
    encoder.encode(String(protocolVersion)),
    encoder.encode(String(timestamp)),
  ];
  return concatUint8Arrays(parts);
}

function solvePoW(powInput, targetBits, onProgress) {
  let nonce = 0;
  const start = performance.now();
  while (true) {
    const nonceBytes = encodeLE64(nonce);
    const combined = concatUint8Arrays([powInput, nonceBytes]);
    const hash = blake2b(combined, null, 64).slice(0, 32);
    if (countLeadingZeroBits(hash) >= targetBits) return nonce;

    nonce++;
    if (nonce % 200000 === 0) {
      const elapsed = ((performance.now() - start) / 1000).toFixed(1);
      if (onProgress) onProgress(`${(nonce / 1e6).toFixed(1)}M hashes (${elapsed}s)...`);
    }
  }
}

// ---------------------------------------------------------------------------
// Signing helpers
// ---------------------------------------------------------------------------

/** Sign an arbitrary message: blake2b512(message)[0:32] → Ed25519 sign → hex */
async function signMessage(message) {
  const hash = blake2b(encoder.encode(message), null, 64).slice(0, 32);
  const sig = await crypto.subtle.sign('Ed25519', privKey, hash);
  return buf2hex(new Uint8Array(sig));
}

/** Sign a post (same input as PoW) */
function buildSignHashInput(content, author, parentRefs, challengeBytes, protocolVersion, timestamp) {
  return buildPowInput(content, author, parentRefs, challengeBytes, protocolVersion, timestamp);
}

async function signPost(content, author, parentRefs, challengeBytes, protocolVersion, timestamp) {
  const input = buildSignHashInput(content, author, parentRefs, challengeBytes, protocolVersion, timestamp);
  const hash = blake2b(input, null, 64).slice(0, 32);
  const sig = await crypto.subtle.sign('Ed25519', privKey, hash);
  return buf2hex(new Uint8Array(sig));
}

async function signLike(targetPostId, likerId) {
  return signMessage(JSON.stringify({ targetPostId, likerId }));
}

async function signUnlike(targetPostId, likerId) {
  return signMessage(JSON.stringify({ targetPostId, likerId, action: 'unlike' }));
}

async function signInviteCreate(inviterId, karmaAmount, bondAmount) {
  return signMessage(`create-invite:${inviterId}:${karmaAmount}:${bondAmount}`);
}

// ---------------------------------------------------------------------------
// Post ID computation (client-side, matches server's computePostId)
// ---------------------------------------------------------------------------

function computePostId(post) {
  const cBytes = typeof post.challenge === 'string' ? hex2buf(post.challenge) : post.challenge;
  const parts = [
    encoder.encode(post.content),
    encoder.encode(post.author),
    ...post.parentRefs.map(r => encoder.encode(r)),
    cBytes,
    encoder.encode(String(post.protocolVersion)),
    encoder.encode(String(post.powNonce)),
    encoder.encode(String(post.timestamp)),
  ];
  const combined = concatUint8Arrays(parts);
  const hash = blake2b(combined, null, 64).slice(0, 32);
  return buf2hex(hash);
}

async function computeUserId(pub) {
  const hash = blake2b(pub, null, 64).slice(0, 32);
  return base58Encode(hash);
}

// ---------------------------------------------------------------------------
// UI helpers
// ---------------------------------------------------------------------------

function setStatus(text, cls) {
  const s = document.getElementById('postStatus');
  s.textContent = text; s.className = 'status status-' + (cls || 'busy');
}

function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ---------------------------------------------------------------------------
// Identity management
// ---------------------------------------------------------------------------

async function importIdentityToServer(pubKeyHex) {
  try {
    const res = await fetch(API + '/identity/import', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ publicKey: pubKeyHex }),
    });
    if (res.ok) {
      const data = await res.json();
      return data.userId;
    }
  } catch {
    // Server might be down
  }
  return null;
}

function refreshIdentityDropdown() {
  const sel = document.getElementById('identitySelect');
  sel.innerHTML = identities.map((ident, i) => {
    const shortPub = ident.pubKeyHex.slice(0, 12) + '...';
    return `<option value="${i}">Identity ${i + 1} (${shortPub})</option>`;
  }).join('');
  if (activeIndex >= 0 && activeIndex < identities.length) {
    sel.value = activeIndex;
  }
}

async function activateIdentity(index) {
  if (index < 0 || index >= identities.length) return;

  activeIndex = index;
  const ident = identities[index];
  pubKeyRaw = hex2buf(ident.pubKeyHex);

  // Decode PKCS8 private key from base64
  const privBytes = Uint8Array.from(atob(ident.privKeyBase64), c => c.charCodeAt(0));
  privKey = await crypto.subtle.importKey('pkcs8', privBytes, 'Ed25519', true, ['sign']);

  // Compute userId
  userId = await computeUserId(pubKeyRaw);

  // Update UI
  document.getElementById('identitySelect').value = index;
  document.getElementById('currentUserId').textContent = userId;
  document.getElementById('postBtn').disabled = false;

  // Import to server (idempotent)
  const serverUserId = await importIdentityToServer(ident.pubKeyHex);
  if (serverUserId) userId = serverUserId;

  // Clear per-session liked tracking for this identity
  likedPosts.clear();

  // Reload feed
  loadFeed();
}

async function createIdentity() {
  // Generate keypair
  const key = await crypto.subtle.generateKey('Ed25519', true, ['sign', 'verify']);
  const pubKeyHex = buf2hex(new Uint8Array(await crypto.subtle.exportKey('raw', key.publicKey)));
  const privBytes = new Uint8Array(await crypto.subtle.exportKey('pkcs8', key.privateKey));
  const privKeyBase64 = btoa(String.fromCharCode(...privBytes));

  // Import to server
  await importIdentityToServer(pubKeyHex);

  // Save to localStorage
  identities.push({ pubKeyHex, privKeyBase64 });
  localStorage.setItem(STORAGE_KEY, JSON.stringify(identities));

  // Refresh dropdown and switch to new identity
  refreshIdentityDropdown();
  await activateIdentity(identities.length - 1);
}

function exportIdentity() {
  if (activeIndex < 0 || activeIndex >= identities.length) return;
  const ident = identities[activeIndex];
  const json = JSON.stringify({ pubKeyHex: ident.pubKeyHex, privKeyBase64: ident.privKeyBase64 });
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'dagsocial-identity.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function importIdentityFile(file) {
  const reader = new FileReader();
  reader.onload = async () => {
    try {
      const data = JSON.parse(reader.result);
      if (!data.pubKeyHex || !data.privKeyBase64) {
        alert('Invalid identity file: missing pubKeyHex or privKeyBase64');
        return;
      }
      if (!/^[0-9a-f]{64}$/i.test(data.pubKeyHex)) {
        alert('Invalid identity file: pubKeyHex must be 64 hex chars');
        return;
      }

      // Check for duplicates
      if (identities.some(i => i.pubKeyHex === data.pubKeyHex)) {
        alert('This identity is already in your list');
        return;
      }

      // Import to server
      await importIdentityToServer(data.pubKeyHex);

      // Save to localStorage
      identities.push({ pubKeyHex: data.pubKeyHex, privKeyBase64: data.privKeyBase64 });
      localStorage.setItem(STORAGE_KEY, JSON.stringify(identities));

      // Refresh dropdown
      refreshIdentityDropdown();
    } catch (e) {
      alert('Failed to parse identity file: ' + e.message);
    }
  };
  reader.readAsText(file);
}

async function loadIdentities() {
  // Read from localStorage
  const stored = localStorage.getItem(STORAGE_KEY);
  if (stored) {
    try {
      identities = JSON.parse(stored);
      if (!Array.isArray(identities)) identities = [];
    } catch {
      identities = [];
    }
  }

  // If empty, auto-generate one
  if (identities.length === 0) {
    const key = await crypto.subtle.generateKey('Ed25519', true, ['sign', 'verify']);
    const pubKeyHex = buf2hex(new Uint8Array(await crypto.subtle.exportKey('raw', key.publicKey)));
    const privBytes = new Uint8Array(await crypto.subtle.exportKey('pkcs8', key.privateKey));
    const privKeyBase64 = btoa(String.fromCharCode(...privBytes));
    identities = [{ pubKeyHex, privKeyBase64 }];
    localStorage.setItem(STORAGE_KEY, JSON.stringify(identities));
  }

  // Re-import each to server (idempotent)
  for (const ident of identities) {
    await importIdentityToServer(ident.pubKeyHex);
  }

  // Populate dropdown
  refreshIdentityDropdown();

  // Activate first identity
  await activateIdentity(0);
}

// Identity UI event handlers
document.getElementById('identitySelect').addEventListener('change', async () => {
  const index = parseInt(document.getElementById('identitySelect').value);
  if (index !== activeIndex) {
    await activateIdentity(index);
  }
});

document.getElementById('newIdentityBtn').addEventListener('click', async () => {
  await createIdentity();
});

document.getElementById('exportIdentityBtn').addEventListener('click', () => {
  exportIdentity();
});

document.getElementById('importIdentityBtn').addEventListener('click', () => {
  document.getElementById('importFileInput').click();
});

document.getElementById('importFileInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (file) {
    importIdentityFile(file);
    e.target.value = '';
  }
});

// ---------------------------------------------------------------------------
// Post flow
// ---------------------------------------------------------------------------

document.getElementById('postBtn').addEventListener('click', async () => {
  const btn = document.getElementById('postBtn');
  const content = document.getElementById('content').value.trim();
  if (!content) return;

  btn.disabled = true;
  try {
    // 1. Request challenge
    setStatus('requesting challenge...', 'busy');
    const chalRes = await fetch(API + '/challenge', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ userId }),
    });
    if (!chalRes.ok) {
      const err = await chalRes.json();
      setStatus(err.error || 'challenge failed', 'error');
      return;
    }
    const { challenge: challengeHex, targetBits } = await chalRes.json();
    const challengeBytes = hex2buf(challengeHex);

    // 2. Build powInput and solve PoW
    setStatus(`solving PoW (${targetBits} bits)...`, 'busy');
    const parentRefs = document.getElementById('parents').value
      .split(',').map(s => s.trim()).filter(Boolean);
    const timestamp = Date.now();
    const protocolVersion = 1;
    const powInput = buildPowInput(content, userId, parentRefs, challengeBytes, protocolVersion, timestamp);

    const powNonce = solvePoW(powInput, targetBits, (msg) => {
      setStatus(msg, 'busy');
    });

    // 3. Sign the post
    setStatus('signing...', 'busy');
    const signature = await signPost(content, userId, parentRefs, challengeBytes, protocolVersion, timestamp);

    // 4. Submit post
    setStatus('posting...', 'busy');
    const postRes = await fetch(API + '/posts', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        content,
        author: userId,
        parentRefs,
        challenge: challengeHex,
        powNonce,
        protocolVersion,
        timestamp,
        signature,
      }),
    });
    if (!postRes.ok) {
      const err = await postRes.json();
      setStatus(err.error || 'post failed', 'error');
      return;
    }
    const posted = await postRes.json();
    setStatus('posted! ' + posted.id.slice(0, 12) + '...', 'ok');
    document.getElementById('content').value = '';
    document.getElementById('parents').value = '';
    loadFeed();
  } catch (e) {
    setStatus('error: ' + e.message, 'error');
  } finally {
    btn.disabled = false;
  }
});

// ---------------------------------------------------------------------------
// Like flow
// ---------------------------------------------------------------------------

async function doLike(targetPostId) {
  try {
    const sigHex = await signLike(targetPostId, userId);
    const res = await fetch(API + '/likes', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ targetPostId, likerId: userId, signature: sigHex }),
    });
    if (!res.ok) {
      const err = await res.json();
      setStatus(err.error || 'like failed', 'error');
      return false;
    }
    return true;
  } catch (e) {
    setStatus('like error: ' + e.message, 'error');
    return false;
  }
}

async function doUnlike(targetPostId) {
  try {
    const sigHex = await signUnlike(targetPostId, userId);
    const res = await fetch(API + '/likes/remove', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ targetPostId, likerId: userId, signature: sigHex }),
    });
    if (!res.ok) {
      const err = await res.json();
      setStatus(err.error || 'unlike failed', 'error');
      return false;
    }
    return true;
  } catch (e) {
    setStatus('unlike error: ' + e.message, 'error');
    return false;
  }
}

// ---------------------------------------------------------------------------
// Feed
// ---------------------------------------------------------------------------

async function loadFeed() {
  const feed = document.getElementById('feed');
  try {
    const res = await fetch(API + '/posts?limit=30');
    const posts = await res.json();
    if (!posts.length) { feed.innerHTML = '<div class="empty">No posts yet. Write something!</div>'; return; }
    feed.innerHTML = posts.map(p => {
      const id = computePostId(p);
      const shortId = id.slice(0, 16);
      const liked = likedPosts.has(id);
      const likeCount = typeof p.likeCount === 'number' ? p.likeCount : 0;
      return `
        <div class="post" data-post-id="${id}">
          <div class="post-author">${esc(p.author.slice(0, 20))}...</div>
          <div class="post-content">${esc(p.content)}</div>
          <div class="post-meta">
            <span>${new Date(p.timestamp).toLocaleTimeString()}</span>
            <span>${p.parentRefs.length ? p.parentRefs.length + ' parents' : 'genesis'}</span>
            <span style="font-family:monospace;font-size:10px">${esc(shortId)}...</span>
            <button class="like-btn${liked ? ' liked' : ''}" data-post-id="${id}" data-liked="${liked ? '1' : '0'}">
              ${liked ? '&#10084;&#65039; Liked' : '&#10084;&#65039; Like'} (${likeCount})
            </button>
          </div>
        </div>
      `;
    }).join('');

    // Attach like/unlike handlers
    feed.querySelectorAll('.like-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const postId = btn.dataset.postId;
        const isLiked = btn.dataset.liked === '1';
        if (!postId) return;

        btn.disabled = true;
        btn.textContent = '...';

        if (isLiked) {
          // Unlike
          const ok = await doUnlike(postId);
          if (ok) {
            likedPosts.delete(postId);
          }
          btn.disabled = false;
          // Reload feed to get updated counts
          loadFeed();
        } else {
          // Like
          const ok = await doLike(postId);
          if (ok) {
            likedPosts.add(postId);
            btn.classList.add('liked');
            btn.dataset.liked = '1';
          }
          btn.disabled = false;
          // Reload feed to get updated counts
          loadFeed();
        }
      });
    });
  } catch (e) {
    feed.innerHTML = '<div class="empty">Failed to load feed</div>';
  }
}

// ---------------------------------------------------------------------------
// Status bar
// ---------------------------------------------------------------------------

async function loadStatus() {
  const bar = document.getElementById('statusBar');
  try {
    const res = await fetch(API + '/status');
    if (!res.ok) { bar.innerHTML = 'Status unavailable'; return; }
    const s = await res.json();
    networkMode = s.networkMode || 'mainnet';

    bar.innerHTML = `
      <div><span>Network:</span> <strong style="color:${networkMode === 'testnet' ? '#d29922' : '#3fb950'}">${esc(networkMode)}</strong></div>
      <div><span>Block height:</span> <strong>${s.blockHeight}</strong></div>
      <div><span>Posts (confirmed / pending):</span> <strong>${s.postCount} / ${s.pendingPosts}</strong></div>
      <div><span>Identities:</span> <strong>${s.identityCount}</strong></div>
      <div><span>Total karma:</span> <strong>${s.totalKarma}</strong> &nbsp; <span>Total credits:</span> <strong>${s.totalCredits}</strong></div>
    `;

    // Show/hide admin section based on network mode
    const admin = document.getElementById('adminSection');
    admin.style.display = networkMode === 'testnet' ? '' : 'none';
  } catch (e) {
    bar.innerHTML = 'Status unavailable';
  }
}

document.getElementById('faucetBtn').addEventListener('click', async () => {
  const btn = document.getElementById('faucetBtn');
  const result = document.getElementById('faucetResult');
  const amount = parseInt(document.getElementById('faucetAmount').value) || 100;

  btn.disabled = true;
  result.innerHTML = '<span class="result-msg">Requesting...</span>';

  try {
    const res = await fetch(API + '/faucet', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ userId, amount }),
    });
    const data = await res.json();
    if (res.ok) {
      result.innerHTML = `<span class="result-msg ok">Granted ${amount} karma. New balance: ${data.newBalance}. Box: ${data.boxId.slice(0, 16)}...</span>`;
      loadStatus();
    } else {
      result.innerHTML = `<span class="result-msg err">${esc(data.error || 'faucet failed')}</span>`;
    }
  } catch (e) {
    result.innerHTML = `<span class="result-msg err">${esc(e.message)}</span>`;
  } finally {
    btn.disabled = false;
  }
});

document.getElementById('createInviteBtn').addEventListener('click', async () => {
  const btn = document.getElementById('createInviteBtn');
  const result = document.getElementById('inviteResult');
  const karmaAmount = parseInt(document.getElementById('inviteKarma').value) || 10;
  const bondAmount = parseInt(document.getElementById('inviteBond').value) || 5;

  btn.disabled = true;

  try {
    const signature = await signInviteCreate(userId, karmaAmount, bondAmount);
    const res = await fetch(API + '/invites', {

      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ inviterId: userId, karmaAmount, bondAmount, signature }),

    if (res.ok) {
      result.innerHTML = `
        <span class="result-msg ok">Invite created!</span>
        <div style="font-size:11px;color:#8b949e;margin:4px 0">Invite Box ID:</div>
        <pre>${esc(data.inviteBoxId)}</pre>
        <div style="font-size:11px;color:#8b949e;margin:4px 0">Secret (share with invitee):</div>
        <pre>${esc(data.secret)}</pre>
        <div style="font-size:11px;color:#8b949e;margin:4px 0">Secret Hash:</div>
        <pre>${esc(data.secretHash)}</pre>
        <div style="font-size:11px;color:#8b949e;margin:4px 0">Bond Box ID:</div>
        <pre>${esc(data.bondBoxId)}</pre>
      `;
      loadStatus();
    } else {
      result.innerHTML = `<span class="result-msg err">${esc(data.error || 'invite creation failed')}</span>`;
    }
  } catch (e) {
    result.innerHTML = `<span class="result-msg err">${esc(e.message)}</span>`;
  } finally {
    btn.disabled = false;
  }
});

document.getElementById('redeemInviteBtn').addEventListener('click', async () => {
  const btn = document.getElementById('redeemInviteBtn');
  const result = document.getElementById('redeemResult');
  const inviteBoxId = document.getElementById('inviteBoxIdInput').value.trim();
  const secret = document.getElementById('inviteSecretInput').value.trim();

  if (!inviteBoxId || !secret) {
    result.innerHTML = '<span class="result-msg err">Both Invite Box ID and Secret are required</span>';
    return;
  }

  btn.disabled = true;
  result.innerHTML = '<span class="result-msg">Redeeming...</span>';

  try {
    const res = await fetch(API + '/invites/claim', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        inviteBoxId,
        secret,
        publicKey: buf2hex(pubKeyRaw),
      }),
    });
    const data = await res.json();
    if (res.ok) {
      result.innerHTML = `
        <span class="result-msg ok">Invite claimed!</span>
        <div style="font-size:11px;color:#8b949e;margin:4px 0">User ID:</div>
        <pre>${esc(data.userId)}</pre>
        <div style="font-size:11px;color:#8b949e;margin:4px 0">Karma Box ID:</div>
        <pre>${esc(data.karmaBoxId)}</pre>
      `;
      loadStatus();
    } else {
      result.innerHTML = `<span class="result-msg err">${esc(data.error || 'redeem failed')}</span>`;
    }
  } catch (e) {
    result.innerHTML = `<span class="result-msg err">${esc(e.message)}</span>`;
  } finally {
    btn.disabled = false;
  }
});
