document.getElementById('createInviteBtn').addEventListener('click', async () => {
  const btn = document.getElementById('createInviteBtn');
  const result = document.getElementById('inviteResult');

  btn.disabled = true;
  result.innerHTML = '<span class="result-msg">Creating invite...</span>';

  try {
    // 1. Fetch karma box
    const karmaBox = await fetchKarmaBox();
    if (!karmaBox) {
      result.innerHTML = '<span class="result-msg err">No karma box found</span>';
      return;
    }
    const totalNeeded = INVITE_KARMA_AMOUNT + INVITE_BOND_KARMA;
    if (karmaBox.total < totalNeeded) {
      result.innerHTML = `<span class="result-msg err">Insufficient karma: need ${totalNeeded}, have ${karmaBox.total}</span>`;
      return;
    }

    // 2. Generate random secret and compute secretHash
    const secretBytes = crypto.getRandomValues(new Uint8Array(32));
    const secretHex = buf2hex(secretBytes);
    const secretHash = blake2b(secretBytes, null, 64).slice(0, 32);
    const secretHashHex = buf2hex(secretHash);

    // 3. Build and sign tx
    const pubKeyHex = buf2hex(pubKeyRaw);
    const tx = buildCreateInviteTx(karmaBox, pubKeyHex, secretHashHex);
    const { signature } = await signTxId(tx);
    tx.signatures[pubKeyHex] = signature;

    // 4. Submit
    const res = await fetch(API + '/invites', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ tx }, jsonBigint),
    });
    const data = await res.json();
    if (res.ok) {
      result.innerHTML = `
        <span class="result-msg ok">Invite created!</span>
        <div style="font-size:11px;color:var(--p-lo);margin:4px 0">Invite Box ID:</div>
        <pre>${esc(data.inviteBoxId)}</pre>
        <div style="font-size:11px;color:var(--p-lo);margin:4px 0">Bond Box ID:</div>
        <pre>${esc(data.bondBoxId)}</pre>
        <div style="font-size:11px;color:var(--p-lo);margin:4px 0">Inviter ID:</div>
        <pre>${esc(pubKeyHex)}</pre>
        <div style="font-size:11px;color:var(--p-lo);margin:4px 0">Secret (share with invitee):</div>
        <pre>${esc(secretHex)}</pre>
        <div style="font-size:11px;color:var(--p-lo);margin:4px 0">Secret Hash (for verification):</div>
        <pre>${esc(secretHashHex)}</pre>
      `;
      loadStatus();
      loadIdentityStatus();
    } else {
      result.innerHTML = `<span class="result-msg err">${esc(data.reason || data.error || 'invite creation failed')}</span>`;
    }
  } catch (e) {
    result.innerHTML = `<span class="result-msg err">${esc(e.message)}</span>`;
  } finally {
    btn.disabled = false;
  }
});

document.getElementById('redeemInviteBtn').addEventListener('click', async () => {
  const btn = document.getElementById('redeemInviteBtn');
  const result = document.getElementById('redeemResult');
  const inviteBoxId = document.getElementById('inviteBoxIdInput').value.trim();
  const bondBoxId = document.getElementById('bondBoxIdForClaimInput').value.trim();
  const inviterId = document.getElementById('inviterIdForClaimInput').value.trim();
  const secretHex = document.getElementById('inviteSecretInput').value.trim();

  if (!inviteBoxId || !bondBoxId || !inviterId || !secretHex) {
    result.innerHTML = '<span class="result-msg err">All fields are required</span>';
    return;
  }

  btn.disabled = true;

  try {
    const inviteePubKeyHex = buf2hex(pubKeyRaw);

    const inviteBox = { id: inviteBoxId, value: INVITE_KARMA_AMOUNT, inviterId };

    // ---- Step 1: Commit ----
    result.innerHTML = '<span class="result-msg">Committing...</span>';

    const bondBox = {
      id: bondBoxId,
      value: INVITE_BOND_KARMA,
      inviterId,
      inviteBoxId: inviteBoxId,
    };

    const commitTx = buildCommitTx(bondBox, inviteePubKeyHex, secretHex);
    const { signature: commitSig } = await signTxId(commitTx);
    commitTx.signatures[inviteePubKeyHex] = commitSig;

    const commitRes = await fetch(API + '/invites/commit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ tx: commitTx }, jsonBigint),
    });
    const commitData = await commitRes.json();
    if (!commitRes.ok) {
      result.innerHTML = `<span class="result-msg err">Commit failed: ${esc(commitData.error || 'unknown error')}</span>`;
      return;
    }

    // Persist probation timers set during commit (block height at commit time)
    bondBox.probationStartBlock = currentBlockHeight;
    bondBox.probationEndBlock = currentBlockHeight + INVITE_PROBATION_BLOCKS;

    // Store secret for reveal step (survives page refresh)
    sessionStorage.setItem('reveal_' + inviteBoxId, JSON.stringify({
      secretHex,
      bondBoxId,
      inviterId,
      inviteePubKeyHex,
      bondInviteBoxId: inviteBoxId,
    }));

    // ---- Step 2: Wait then reveal ----
    result.innerHTML = '<span class="result-msg">Committed — waiting for block inclusion...</span>';

    // Poll for block height change (or use fixed delay)
    const startHeight = currentBlockHeight;
    const checkReveal = async () => {
      await loadStatus(); // refreshes currentBlockHeight
      if (currentBlockHeight > startHeight) {
        // Block advanced — proceed to reveal
        result.innerHTML = '<span class="result-msg">Revealing...</span>';

        const revealTx = buildClaimInviteTx(inviteBox, bondBox, inviteePubKeyHex, secretHex);
        const { signature: revealSig } = await signTxId(revealTx);
        revealTx.signatures[inviteePubKeyHex] = revealSig;

        const revealRes = await fetch(API + '/invites/claim', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ tx: revealTx }, jsonBigint),
        });
        const revealData = await revealRes.json();
        if (revealRes.ok) {
          sessionStorage.removeItem('reveal_' + inviteBoxId);
          result.innerHTML = `
            <span class="result-msg ok">Invite claimed!</span>
            <div style="font-size:11px;color:var(--p-lo);margin:4px 0">User ID:</div>
            <pre>${esc(revealData.userId)}</pre>
            <div style="font-size:11px;color:var(--p-lo);margin:4px 0">Karma Box ID:</div>
            <pre>${esc(revealData.karmaBoxId)}</pre>
          `;
          loadStatus();
          loadIdentityStatus();
        } else {
          result.innerHTML = `<span class="result-msg err">Reveal failed: ${esc(revealData.error || 'unknown error')}</span>`;
        }
      } else {
        // Not yet — poll again in 5 seconds
        setTimeout(checkReveal, 5000);
      }
    };

    setTimeout(checkReveal, 3000); // Start polling after 3s
  } catch (e) {
    result.innerHTML = `<span class="result-msg err">${esc(e.message)}</span>`;
  } finally {
    btn.disabled = false;
  }
});

document.getElementById('cancelInviteBtn').addEventListener('click', async () => {
  const btn = document.getElementById('cancelInviteBtn');
  const result = document.getElementById('cancelInviteResult');
  const inviteBoxId = document.getElementById('cancelInviteBoxIdInput').value.trim();

  if (!inviteBoxId) {
    result.innerHTML = '<span class="result-msg err">Invite Box ID is required</span>';
    return;
  }

  btn.disabled = true;
  result.innerHTML = '<span class="result-msg">Cancelling invite...</span>';

  try {
    // Fetch karma box and invite state to build the cancel tx
    const karmaBox = await fetchKarmaBox();
    if (!karmaBox) {
      result.innerHTML = '<span class="result-msg err">No karma box found</span>';
      return;
    }

    const inviteState = await fetchInviteState();
    const invBox = inviteState.pending.find(b => b.id === inviteBoxId);
    if (!invBox) {
      result.innerHTML = `<span class="result-msg err">Invite ${inviteBoxId.slice(0, 16)}... not found in your pending invites</span>`;
      return;
    }

    // Find the matching bond box (same inviterId, unclaimed)
    const bondBox = inviteState.bonds.find(b =>
      b.inviterId === invBox.inviterId &&
      (!b.inviteePublicKey || b.inviteePublicKey === '00'.repeat(32))
    );

    const pubKeyHex = buf2hex(pubKeyRaw);
    const tx = buildCancelInviteTx(
      karmaBox,
      { id: invBox.id, value: invBox.value },
      { id: bondBox?.id || '00'.repeat(32), value: bondBox?.value ?? 0n },
      pubKeyHex,
    );
    const { signature } = await signTxId(tx);
    tx.signatures[pubKeyHex] = signature;

    const res = await fetch(API + '/invites/cancel', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ tx }, jsonBigint),
    });
    const data = await res.json();
    if (res.ok) {
      result.innerHTML = `<span class="result-msg ok">Invite cancelled! TxId: ${(data.txId || '').slice(0, 16)}...</span>`;
      loadStatus();
      loadIdentityStatus();
    } else {
      result.innerHTML = `<span class="result-msg err">${esc(data.reason || data.error || 'cancel failed')}</span>`;
    }
  } catch (e) {
    result.innerHTML = `<span class="result-msg err">${esc(e.message)}</span>`;
  } finally {
    btn.disabled = false;
  }
});
