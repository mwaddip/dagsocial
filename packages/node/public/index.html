<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DAGsocial Demo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #0d1117; color: #c9d1d9; display: flex; height: 100vh; }
  .panel { padding: 20px; overflow-y: auto; }
  .left { width: 420px; min-width: 420px; border-right: 1px solid #30363d; display: flex; flex-direction: column; gap: 16px; }
  .right { flex: 1; }

  textarea { height: 120px; resize: vertical; }
  input, select { height: 36px; }
  select { cursor: pointer; }
  button { background: #238636; color: #fff; border: none; border-radius: 6px; padding: 8px 16px; font-size: 13px; cursor: pointer; font-weight: 500; }
  button:hover { background: #2ea043; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button.small { padding: 4px 10px; font-size: 11px; }
  button.danger { background: #da3633; }
  button.danger:hover { background: #f85149; }

  .post-author { font-size: 11px; color: #58a6ff; font-family: monospace; margin-bottom: 6px; }

  .status { font-size: 11px; padding: 4px 8px; border-radius: 10px; }

  .status-busy { background: #3b2816; color: #d29922; }
  .status-error { background: #3b1616; color: #f85149; }

  .status-bar { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 10px; font-size: 12px; line-height: 1.6; }

  .status-bar strong { color: #c9d1d9; }

  .result-msg.err { color: #f85149; }
  hr { border: none; border-top: 1px solid #21262d; margin: 8px 0; }

<div class="panel right">
  <h2>Feed</h2>

<script type="module">
import { blake2b } from 'https://cdn.jsdelivr.net/npm/blakejs@1.2.1/+esm';

const API = '';
const encoder = new TextEncoder();

// ===========================================================================
// Protocol constants (mirrored from @dagsocial/types constants.ts)
// ===========================================================================

const PROTOCOL_VERSION = 1;
const LIKE_COST = 2;
const POST_LOCK_THREAD_COST = 5;
const POST_LOCK_REPLY_COST = 3;
const INVITE_KARMA_AMOUNT = 25;
const INVITE_BOND_KARMA = 25;
const INVITE_PROBATION_BLOCKS = 1000;

// ===========================================================================
// State
// ===========================================================================

const STORAGE_KEY = 'dagsocial-identities';
let identities = [];
let activeIndex = -1;
let userId, pubKeyRaw, privKey;
let networkMode = 'mainnet';
const likedPosts = new Set();
/** Map of targetPostId → { likeBoxId, isFree } for unlike */
const likeBoxes = new Map();
/** Current block height from /status */
let currentBlockHeight = 0;

// ===========================================================================
// Hex / byte utilities
// ===========================================================================

function buf2hex(buf) {
  return [...buf].map(b => b.toString(16).padStart(2, '0')).join('');
}

function hex2buf(hex) {
  const bytes = new Uint8Array(hex.length / 2);
  for (let i = 0; i < hex.length; i += 2) {
    bytes[i / 2] = parseInt(hex.substring(i, i + 2), 16);
  }
  return bytes;
}

function concatUint8Arrays(arrays) {
  const totalLength = arrays.reduce((s, a) => s + a.length, 0);
  const result = new Uint8Array(totalLength);
  let offset = 0;
  for (const a of arrays) {
    result.set(a, offset);
    offset += a.length;
  }
  return result;
}

function encodeLE64(n) {
  const buf = new ArrayBuffer(8);
  new DataView(buf).setBigUint64(0, BigInt(n), true);
  return new Uint8Array(buf);
}

// ===========================================================================
// CBOR Encoder (minimal, matches cbor-x 1.6.4 output for box types)
// ===========================================================================

/**
 * Key insight: cbor-x preserves JavaScript object insertion order for map
 * keys — it does NOT sort canonically.  We match by encoding keys in the
 * order Object.keys() returns them, which is insertion order.
 */

function cborEncodeString(str) {
  const bytes = encoder.encode(str);
  const len = bytes.length;
  if (len <= 23) return concatUint8Arrays([new Uint8Array([0x60 | len]), bytes]);
  if (len <= 255) return concatUint8Arrays([new Uint8Array([0x78, len]), bytes]);
  throw new Error('String too long for CBOR: ' + len);
}

function cborEncodeBytes(buf) {
  const len = buf.length;
  if (len <= 23) return concatUint8Arrays([new Uint8Array([0x40 | len]), buf]);
  if (len <= 255) return concatUint8Arrays([new Uint8Array([0x58, len]), buf]);
  throw new Error('Bytes too long for CBOR: ' + len);
}

function cborEncodeInt(n) {
  if (n >= 0) {
    if (n <= 23) return new Uint8Array([n]);
    if (n <= 255) return new Uint8Array([0x18, n]);
    if (n <= 65535) return new Uint8Array([0x19, (n >> 8) & 0xFF, n & 0xFF]);
    throw new Error('Number too large for CBOR: ' + n);
  } else {
    const val = -1 - n;
    if (val <= 23) return new Uint8Array([0x20 | val]);
    if (val <= 255) return new Uint8Array([0x38, val]);
    if (val <= 65535) return new Uint8Array([0x39, (val >> 8) & 0xFF, val & 0xFF]);
    throw new Error('Number too small for CBOR: ' + n);
  }
}

function cborEncodeUndefined() { return new Uint8Array([0xf7]); }

/** Encode a plain object as a CBOR map.  Preserves insertion order. */
function cborEncodeMap(obj) {
  const keys = Object.keys(obj);
  const parts = [];
  for (const k of keys) {
    parts.push(cborEncodeString(k));
    const v = obj[k];
    if (typeof v === 'string')            parts.push(cborEncodeString(v));
    else if (typeof v === 'number')       parts.push(cborEncodeInt(v));
    else if (typeof v === 'boolean')      parts.push(new Uint8Array([v ? 0xf5 : 0xf4]));
    else if (v === undefined || v === null) parts.push(cborEncodeUndefined());
    else if (v instanceof Uint8Array)     parts.push(cborEncodeBytes(v));
    else throw new Error('Unsupported CBOR value type for key ' + k);
  }
  const body = concatUint8Arrays(parts);
  const numPairs = keys.length;
  // cbor-x always emits 0xB9 + 2-byte big-endian length for maps
  const header = new Uint8Array([0xB9, (numPairs >> 8) & 0xFF, numPairs & 0xFF]);
  return concatUint8Arrays([header, body]);
}

function cborEncode(value) {
  if (typeof value === 'string')              return cborEncodeString(value);
  if (typeof value === 'number')              return cborEncodeInt(value);
  if (typeof value === 'boolean')             return new Uint8Array([value ? 0xf5 : 0xf4]);
  if (value === undefined || value === null)  return cborEncodeUndefined();
  if (value instanceof Uint8Array)            return cborEncodeBytes(value);
  if (typeof value === 'object')              return cborEncodeMap(value);
  throw new Error('Unsupported CBOR type');
}

// ===========================================================================
// computeTxId (client-side, matches server @dagsocial/types computeTxId)
// ===========================================================================

/**
 * Deterministic transaction ID.
 * Hashes inputs (hex strings), CBOR-encoded outputs (minus `id`),
 * preimages (sorted by boxId), and protocolVersion.
 */
function computeTxId(tx) {
  const parts = [];

  // 1. Inputs — hash hex strings as UTF-8 text
  for (const input of tx.inputs) {
    parts.push(encoder.encode(input));
  }

  // 2. Outputs — CBOR encode each box, stripping `id` before encoding
  for (const output of tx.outputs) {
    const { id, ...rest } = output;
    // Convert hex-string binary fields to Uint8Array for CBOR encoding
    const binaryFields = ['owner', 'likerId', 'secretHash', 'inviterId', 'inviteePublicKey'];
    const boxForCbor = {};
    for (const [k, v] of Object.entries(rest)) {
      if (binaryFields.includes(k) && typeof v === 'string') {
        boxForCbor[k] = hex2buf(v);
      } else {
        boxForCbor[k] = v;
      }
    }
    parts.push(cborEncode(boxForCbor));
  }

  // 3. Preimages (sorted by boxId key, if present)
  if (tx.preimages) {
    const sortedKeys = Object.keys(tx.preimages).sort();
    for (const boxId of sortedKeys) {
      parts.push(encoder.encode(boxId));
      const preimage = tx.preimages[boxId];
      parts.push(typeof preimage === 'string' ? hex2buf(preimage) : preimage);
    }
  }

  // 4. Protocol version as UTF-8 string
  parts.push(encoder.encode(String(tx.protocolVersion)));

  // 5. Blake2b-512 → first 32 bytes → hex
  const combined = concatUint8Arrays(parts);
  const hash = blake2b(combined, null, 64).slice(0, 32);
  return buf2hex(hash);
}

// ===========================================================================
// PoW
// ===========================================================================

function countLeadingZeroBits(buf) {
  let bits = 0;
  for (let i = 0; i < buf.length; i++) {
    if (buf[i] === 0) { bits += 8; continue; }
    let mask = 0x80;
    while ((buf[i] & mask) === 0) { bits++; mask >>= 1; }
    break;
  }
  return bits;
}

function buildPowInput(content, authorBytes, parentRefs, challengeBytes, protocolVersion, timestamp) {
  const parts = [
    encoder.encode(content),
    authorBytes,
    ...parentRefs.map(r => encoder.encode(r)),
    challengeBytes,
    encoder.encode(String(protocolVersion)),
    encoder.encode(String(timestamp)),
  ];
  return concatUint8Arrays(parts);
}

function solvePoW(powInput, targetBits, onProgress) {
  let nonce = 0;
  const start = performance.now();
  while (true) {
    const nonceBytes = encodeLE64(nonce);
    const combined = concatUint8Arrays([powInput, nonceBytes]);
    const hash = blake2b(combined, null, 64).slice(0, 32);
    if (countLeadingZeroBits(hash) >= targetBits) return nonce;

    nonce++;
    if (nonce % 200000 === 0) {
      const elapsed = ((performance.now() - start) / 1000).toFixed(1);
      if (onProgress) onProgress(`${(nonce / 1e6).toFixed(1)}M hashes (${elapsed}s)...`);
    }
  }
}

// ===========================================================================
// Signing — txId-based (Ed25519 over computeTxId)
// ===========================================================================

/** Sign a txId hash with the current identity's Ed25519 private key. */
async function signTxId(tx) {
  const txId = computeTxId(tx);
  const txIdBytes = hex2buf(txId);
  const sig = await crypto.subtle.sign('Ed25519', privKey, txIdBytes);
  return { txId, signature: buf2hex(new Uint8Array(sig)) };
}

/** Sign a post (same input as PoW, excludes powNonce). Preserved for post signing. */
function buildSignHashInput(content, authorBytes, parentRefs, challengeBytes, protocolVersion, timestamp) {
  return buildPowInput(content, authorBytes, parentRefs, challengeBytes, protocolVersion, timestamp);
}

async function signPost(content, authorBytes, parentRefs, challengeBytes, protocolVersion, timestamp) {
  const input = buildSignHashInput(content, authorBytes, parentRefs, challengeBytes, protocolVersion, timestamp);
  const hash = blake2b(input, null, 64).slice(0, 32);
  const sig = await crypto.subtle.sign('Ed25519', privKey, hash);
  return buf2hex(new Uint8Array(sig));
}

// ===========================================================================
// UTXO state fetching
// ===========================================================================

/**
 * Fetch all karma boxes for the active identity.
 * Returns { total, boxes: [{ boxId, value }] } plus backward-compat
 * .balance (= total) and .boxId (= boxes[0].boxId if any).
 */
async function fetchKarmaBox() {
  if (!userId) return null;
  try {
    const res = await fetch(API + '/karma/' + encodeURIComponent(userId));
    if (!res.ok) return null;
    const data = await res.json(); // { userId, total, boxes: [{ boxId, value }] }
    // Backward-compat: add .balance and .boxId for older callers
    data.balance = data.total;
    data.boxId = data.boxes.length > 0 ? data.boxes[0].boxId : null;
    return data;
  } catch {
    return null;
  }
}

/**
 * Largest-first UTXO selection. Returns boxes whose combined value covers
 * requiredAmount. Assumes boxes are sorted value descending (server does this).
 * Throws if total is insufficient.
 */
function selectBoxes(boxes, requiredAmount) {
  if (requiredAmount <= 0) return [];
  let accumulated = 0;
  const selected = [];
  for (const box of boxes) {
    accumulated += box.value;
    selected.push(box);
    if (accumulated >= requiredAmount) break;
  }
  if (accumulated < requiredAmount) {
    throw new Error(`Insufficient total value: need ${requiredAmount}, have ${accumulated}`);
  }
  return selected;
}

async function fetchCreditBoxes() {
  if (!userId) return null;
  try {
    const res = await fetch(API + '/credits/' + encodeURIComponent(userId));
    if (!res.ok) return null;
    return await res.json(); // { userId, total, boxes: [{ boxId, value, lockedUntilBlock? }] }
  } catch {
    return null;
  }
}

/** Fetch pending invite and bond boxes for the active identity. */
async function fetchInviteState() {
  if (!userId) return { pending: [], bonds: [] };
  try {
    const res = await fetch(API + '/invites/' + encodeURIComponent(userId));
    if (!res.ok) return { pending: [], bonds: [] };
    return await res.json(); // { pending: InviteBox[], bonds: BondBox[] }
  } catch {
    return { pending: [], bonds: [] };
  }
}

// ===========================================================================
// Tx construction helpers
// ===========================================================================

/** Build the karma-lock tx for post creation. Uses all boxes needed to cover lockAmount. */
function buildKarmaLockTx(karmaBox, lockAmount, targetPostId, pubKeyHex) {
  const now = currentBlockHeight;
  const selected = selectBoxes(karmaBox.boxes, lockAmount);
  const selectedTotal = selected.reduce((sum, b) => sum + b.value, 0);
  const newKarmaValue = selectedTotal - lockAmount;

  const karmaOutput = {
    boxType: 'karma',
    value: newKarmaValue,
    createdAtBlock: now,
    owner: pubKeyHex,
    guard: 'owner_signature',
    proofSource: targetPostId,
    lastTouchBlock: now,
  };

  const postLockOutput = {
    boxType: 'post_lock',
    value: lockAmount,
    createdAtBlock: now,
    originalValue: lockAmount,
    owner: pubKeyHex,
    targetPostId,
    guard: 'epoch_tally',
  };

  return {
    inputs: selected.map(b => b.boxId),
    outputs: [karmaOutput, postLockOutput],
    signatures: {},
    protocolVersion: PROTOCOL_VERSION,
  };
}

/** Build a like tx: consumes karma boxes, produces karma (total - 2) + LikeBox. */
function buildLikeTx(karmaBox, targetPostId, pubKeyHex) {
  const now = currentBlockHeight;
  const selected = selectBoxes(karmaBox.boxes, LIKE_COST);
  const selectedTotal = selected.reduce((sum, b) => sum + b.value, 0);
  const newKarmaValue = selectedTotal - LIKE_COST;

  const karmaOutput = {
    boxType: 'karma',
    value: newKarmaValue,
    createdAtBlock: now,
    owner: pubKeyHex,
    guard: 'owner_signature',
    proofSource: targetPostId,
    lastTouchBlock: now,
  };

  const likeOutput = {
    boxType: 'like',
    value: LIKE_COST,
    createdAtBlock: now,
    likerId: pubKeyHex,
    targetPostId,
    guard: 'epoch_tally',
  };

  return {
    inputs: selected.map(b => b.boxId),
    outputs: [karmaOutput, likeOutput],
    signatures: {},
    protocolVersion: PROTOCOL_VERSION,
  };
}

/** Build an unlike tx: consumes a LikeBox, produces karma (value - 1 penalty). */
function buildUnlikeTx(likeBoxId, pubKeyHex) {
  const now = currentBlockHeight;
  const refundValue = LIKE_COST - 1; // 2 locked - 1 penalty = 1

  const karmaOutput = {
    boxType: 'karma',
    value: refundValue,
    createdAtBlock: now,
    owner: pubKeyHex,
    guard: 'owner_signature',
    proofSource: 'unlike',
    lastTouchBlock: now,
  };

  return {
    inputs: [likeBoxId],
    outputs: [karmaOutput],
    signatures: {},
    protocolVersion: PROTOCOL_VERSION,
  };
}

/** Build an invite-create tx: karma boxes → karma + invite + bond. */
function buildCreateInviteTx(karmaBox, pubKeyHex, secretHashHex) {
  const now = currentBlockHeight;
  const totalDeducted = INVITE_KARMA_AMOUNT + INVITE_BOND_KARMA;
  const selected = selectBoxes(karmaBox.boxes, totalDeducted);
  const selectedTotal = selected.reduce((sum, b) => sum + b.value, 0);
  const newKarmaValue = selectedTotal - totalDeducted;

  const karmaOutput = {
    boxType: 'karma',
    value: newKarmaValue,
    createdAtBlock: now,
    owner: pubKeyHex,
    guard: 'owner_signature',
    proofSource: 'invite-create',
    lastTouchBlock: now,
  };

  const inviteOutput = {
    boxType: 'invite',
    value: INVITE_KARMA_AMOUNT,
    createdAtBlock: now,
    secretHash: secretHashHex,
    inviterId: pubKeyHex,
    guard: 'hash_preimage_with_bond',
  };

  const inviteBoxId = computeBoxId(inviteOutput);
  inviteOutput.id = inviteBoxId;

  const bondOutput = {
    boxType: 'bond',
    value: INVITE_BOND_KARMA,
    createdAtBlock: now,
    inviterId: pubKeyHex,
    inviteBoxId: inviteBoxId,
    inviteePublicKey: '00'.repeat(32), // 32 zero bytes = unclaimed
    probationStartBlock: 0,
    probationEndBlock: 0,
    guard: 'bond_dual',
  };

  return {
    inputs: selected.map(b => b.boxId),
    outputs: [karmaOutput, inviteOutput, bondOutput],
    signatures: {},
    protocolVersion: PROTOCOL_VERSION,
  };
}

/**
 * Build an invite-claim tx: invite + bond → karma(invitee) + bond(claimed).
 * @param {Object} inviteBox - { id, value, inviterId, secretHash }
 * @param {Object} bondBox - { id, value }
 * @param {string} inviteePubKeyHex
 * @param {string} secretHex - raw hex preimage for hash_preimage guard
 */
function buildClaimInviteTx(inviteBox, bondBox, inviteePubKeyHex, secretHex) {
  const now = currentBlockHeight;

  const karmaOutput = {
    boxType: 'karma',
    value: inviteBox.value,
    createdAtBlock: now,
    owner: inviteePubKeyHex,
    guard: 'owner_signature',
    proofSource: inviteBox.id,
    lastTouchBlock: now,
  };

  const bondOutput = {
    boxType: 'bond',
    value: bondBox.value,
    createdAtBlock: now,
    inviterId: inviteBox.inviterId,
    inviteBoxId: bondBox.inviteBoxId || '',
    inviteePublicKey: inviteePubKeyHex,
    probationStartBlock: bondBox.probationStartBlock,
    probationEndBlock: bondBox.probationEndBlock,
    guard: 'bond_dual',
  };

  return {
    inputs: [inviteBox.id, bondBox.id],
    outputs: [karmaOutput, bondOutput],
    signatures: {},
    preimages: { [inviteBox.id]: secretHex },
    protocolVersion: PROTOCOL_VERSION,
  };
}

/**
 * Build a commit tx: BondBox(unclaimed) → BondBox(committed).
 * Called as step 1 of the two-step redeem. The preimage proves knowledge
 * of the secret without publishing it on-chain yet.
 * @param {Object} bondBox - { id, value, inviterId, inviteBoxId }
 * @param {string} inviteePubKeyHex
 * @param {string} secretHex - raw hex preimage for bond_dual's hash_preimage path
 */
function buildCommitTx(bondBox, inviteePubKeyHex, secretHex) {
  const now = currentBlockHeight;

  const bondOutput = {
    boxType: 'bond',
    value: bondBox.value,
    createdAtBlock: now,
    inviterId: bondBox.inviterId,
    inviteBoxId: bondBox.inviteBoxId,
    inviteePublicKey: inviteePubKeyHex,
    probationStartBlock: now,
    probationEndBlock: now + INVITE_PROBATION_BLOCKS,
    guard: 'bond_dual',
  };

  return {
    inputs: [bondBox.id],
    outputs: [bondOutput],
    signatures: {},
    preimages: { [bondBox.id]: secretHex },
    protocolVersion: PROTOCOL_VERSION,
  };
}

/**
 * Build an invite-cancel tx: karma + invite + bond → karma (refund to inviter).
 * @param {Object} karmaBox - { total, boxes }
 * @param {Object} inviteBox - { id, value }
 * @param {Object} bondBox - { id, value }
 * @param {string} pubKeyHex - inviter's public key
 */
function buildCancelInviteTx(karmaBox, inviteBox, bondBox, pubKeyHex) {
  const now = currentBlockHeight;
  // Refund: consolidate all karma boxes + invite value + bond value
  const allKarmaBoxIds = karmaBox.boxes.map(b => b.boxId);
  const totalRefund = karmaBox.total + inviteBox.value + bondBox.value;

  const karmaOutput = {
    boxType: 'karma',
    value: totalRefund,
    createdAtBlock: now,
    owner: pubKeyHex,
    guard: 'owner_signature',
    proofSource: 'invite-cancel',
    lastTouchBlock: now,
  };

  return {
    inputs: [...allKarmaBoxIds, inviteBox.id, bondBox.id],
    outputs: [karmaOutput],
    signatures: {},
    protocolVersion: PROTOCOL_VERSION,
  };
}

// ===========================================================================
// computeBoxId (client-side, matches server computeBoxId)
// ===========================================================================

function computeBoxId(box) {
  const { id, ...rest } = box;
  const binaryFields = ['owner', 'likerId', 'secretHash', 'inviterId', 'inviteePublicKey'];
  const boxForCbor = {};
  for (const [k, v] of Object.entries(rest)) {
    if (binaryFields.includes(k) && typeof v === 'string') {
      boxForCbor[k] = hex2buf(v);
    } else {
      boxForCbor[k] = v;
    }
  }
  const cborBytes = cborEncode(boxForCbor);
  const hash = blake2b(cborBytes, null, 64).slice(0, 32);
  return buf2hex(hash);
}

// ===========================================================================
// Post ID computation (client-side, matches server computePostId)
// ===========================================================================

function computePostId(post) {
  const cBytes = typeof post.challenge === 'string' ? hex2buf(post.challenge) : post.challenge;
  const aBytes = typeof post.author === 'string' ? hex2buf(post.author) : post.author;
  const parts = [
    encoder.encode(post.content),
    aBytes,
    ...post.parentRefs.map(r => encoder.encode(r)),
    cBytes,
    encoder.encode(String(post.protocolVersion)),
    encoder.encode(String(post.powNonce)),
    encoder.encode(String(post.timestamp)),
  ];
  const combined = concatUint8Arrays(parts);
  const hash = blake2b(combined, null, 64).slice(0, 32);
  return buf2hex(hash);
}

// Identity management
// ===========================================================================

function refreshIdentityDropdown() {
  const sel = document.getElementById('identitySelect');
  sel.innerHTML = identities.map((ident, i) => {
    const shortPub = ident.pubKeyHex.slice(0, 12) + '...';
    return `<option value="${i}">Identity ${i + 1} (${shortPub})</option>`;
  }).join('');
  if (activeIndex >= 0 && activeIndex < identities.length) {
    sel.value = activeIndex;
  }
}

async function activateIdentity(index) {
  if (index < 0 || index >= identities.length) return;

  activeIndex = index;
  const ident = identities[index];
  pubKeyRaw = hex2buf(ident.pubKeyHex);

  // Decode PKCS8 private key from base64
  const privBytes = Uint8Array.from(atob(ident.privKeyBase64), c => c.charCodeAt(0));
  privKey = await crypto.subtle.importKey('pkcs8', privBytes, 'Ed25519', true, ['sign']);

  // userId IS the hex-encoded public key
  userId = ident.pubKeyHex;

  // Update UI
  document.getElementById('identitySelect').value = index;
  document.getElementById('currentUserId').textContent = userId;
  document.getElementById('postBtn').disabled = false;

  // Clear per-session liked tracking for this identity
  likedPosts.clear();
  likeBoxes.clear();

  // Load per-identity balances
  loadIdentityStatus();

  // Reload feed
  loadFeed();
}

async function createIdentity() {
  // Generate keypair
  const key = await crypto.subtle.generateKey('Ed25519', true, ['sign', 'verify']);
  const pubKeyHex = buf2hex(new Uint8Array(await crypto.subtle.exportKey('raw', key.publicKey)));
  const privBytes = new Uint8Array(await crypto.subtle.exportKey('pkcs8', key.privateKey));
  const privKeyBase64 = btoa(String.fromCharCode(...privBytes));

  // Save to localStorage
  identities.push({ pubKeyHex, privKeyBase64 });
  localStorage.setItem(STORAGE_KEY, JSON.stringify(identities));

  // Refresh dropdown and switch to new identity
  refreshIdentityDropdown();
  await activateIdentity(identities.length - 1);
}

function exportIdentity() {
  if (activeIndex < 0 || activeIndex >= identities.length) return;
  const ident = identities[activeIndex];
  const json = JSON.stringify({ pubKeyHex: ident.pubKeyHex, privKeyBase64: ident.privKeyBase64 });
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'dagsocial-identity.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function importIdentityFile(file) {
  const reader = new FileReader();
  reader.onload = async () => {
    try {
      const data = JSON.parse(reader.result);
      if (!data.pubKeyHex || !data.privKeyBase64) {
        alert('Invalid identity file: missing pubKeyHex or privKeyBase64');
        return;
      }
      if (!/^[0-9a-f]{64}$/i.test(data.pubKeyHex)) {
        alert('Invalid identity file: pubKeyHex must be 64 hex chars');
        return;
      }

      // Check for duplicates
      if (identities.some(i => i.pubKeyHex === data.pubKeyHex)) {
        alert('This identity is already in your list');
        return;
      }

      // Save to localStorage
      identities.push({ pubKeyHex: data.pubKeyHex, privKeyBase64: data.privKeyBase64 });
      localStorage.setItem(STORAGE_KEY, JSON.stringify(identities));

      // Refresh dropdown
      refreshIdentityDropdown();
    } catch (e) {
      alert('Failed to parse identity file: ' + e.message);
    }
  };
  reader.readAsText(file);
}

async function loadIdentities() {
  // Read from localStorage
  const stored = localStorage.getItem(STORAGE_KEY);
  if (stored) {
    try {
      identities = JSON.parse(stored);
      if (!Array.isArray(identities)) identities = [];
    } catch {
      identities = [];
    }
  }

  // If empty, auto-generate one
  if (identities.length === 0) {
    const key = await crypto.subtle.generateKey('Ed25519', true, ['sign', 'verify']);
    const pubKeyHex = buf2hex(new Uint8Array(await crypto.subtle.exportKey('raw', key.publicKey)));
    const privBytes = new Uint8Array(await crypto.subtle.exportKey('pkcs8', key.privateKey));
    const privKeyBase64 = btoa(String.fromCharCode(...privBytes));
    identities = [{ pubKeyHex, privKeyBase64 }];
    localStorage.setItem(STORAGE_KEY, JSON.stringify(identities));
  }

  // Populate dropdown
  refreshIdentityDropdown();

  // Activate first identity
  await activateIdentity(0);
}

// ===========================================================================
// Post flow (with karma-lock tx)
// ===========================================================================

document.getElementById('postBtn').addEventListener('click', async () => {
  const btn = document.getElementById('postBtn');
  const content = document.getElementById('content').value.trim();
  if (!content) return;

  btn.disabled = true;
  try {
    // 1. Fetch current karma box
    const karmaBox = await fetchKarmaBox();
    if (!karmaBox) {
      setStatus('No karma box found — use faucet first', 'error');
      return;
    }

    // 2. Request challenge
    setStatus('requesting challenge...', 'busy');
    const chalRes = await fetch(API + '/challenge', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ userId }),
    });
    if (!chalRes.ok) {
      const err = await chalRes.json();
      setStatus(err.error || 'challenge failed', 'error');
      return;
    }
    const { challenge: challengeHex, targetBits } = await chalRes.json();
    const challengeBytes = hex2buf(challengeHex);

    // 3. Build powInput and solve PoW
    setStatus(`solving PoW (${targetBits} bits)...`, 'busy');
    const parentRefs = document.getElementById('parents').value
      .split(',').map(s => s.trim()).filter(Boolean);
    const timestamp = Date.now();
    const powInput = buildPowInput(content, pubKeyRaw, parentRefs, challengeBytes, PROTOCOL_VERSION, timestamp);

    const powNonce = solvePoW(powInput, targetBits, (msg) => {
      setStatus(msg, 'busy');
    });

    // 4. Sign the post
    setStatus('signing post...', 'busy');
    const signature = await signPost(content, pubKeyRaw, parentRefs, challengeBytes, PROTOCOL_VERSION, timestamp);

    // 5. Determine lock amount
    const lockAmount = parentRefs.length === 0 ? POST_LOCK_THREAD_COST : POST_LOCK_REPLY_COST;
    if (karmaBox.total < lockAmount) {
      setStatus(`Insufficient karma: need ${lockAmount}, have ${karmaBox.total}`, 'error');
      return;
    }

    // 6. Build post (for postId computation)
    const post = {
      content,
      author: userId,
      parentRefs,
      challenge: challengeHex,
      powNonce,
      protocolVersion: PROTOCOL_VERSION,
      timestamp,
      signature,
    };
    const postId = computePostId(post);

    // 7. Build and sign karma-lock tx
    setStatus('building karma-lock tx...', 'busy');
    const pubKeyHex = buf2hex(pubKeyRaw);
    const karmaLockTx = buildKarmaLockTx(karmaBox, lockAmount, postId, pubKeyHex);
    const clientTxId = computeTxId(karmaLockTx);
    console.log('[client] txId:', clientTxId);
    const { signature: txSig } = await signTxId(karmaLockTx);
    karmaLockTx.signatures[pubKeyHex] = txSig;

    // 8. Submit post + karma-lock tx
    setStatus('posting...', 'busy');
    const postRes = await fetch(API + '/posts', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        content,
        author: userId,
        parentRefs,
        challenge: challengeHex,
        powNonce,
        protocolVersion: PROTOCOL_VERSION,
        timestamp,
        signature,
        karmaLockTx,
      }),
    });
    if (!postRes.ok) {
      const err = await postRes.json();
      setStatus(err.error || 'post failed', 'error');
      return;
    }
    const posted = await postRes.json();
    setStatus('posted! ' + posted.postId.slice(0, 12) + '...', 'ok');
    document.getElementById('content').value = '';
    document.getElementById('parents').value = '';
    loadFeed();
    loadIdentityStatus();
  } catch (e) {
    setStatus('error: ' + e.message, 'error');
  } finally {
    btn.disabled = false;
  }
});

// ===========================================================================
// Like / Unlike flow (tx-based)
// ===========================================================================

async function doLike(targetPostId) {
  try {
    const karmaBox = await fetchKarmaBox();
    if (!karmaBox) {
      setStatus('No karma box — cannot like', 'error');
      return false;
    }
    if (karmaBox.total < LIKE_COST) {
      setStatus(`Insufficient karma to like: need ${LIKE_COST}, have ${karmaBox.total}`, 'error');
      return false;
    }

    const pubKeyHex = buf2hex(pubKeyRaw);
    const tx = buildLikeTx(karmaBox, targetPostId, pubKeyHex);
    const { signature } = await signTxId(tx);
    tx.signatures[pubKeyHex] = signature;

    const res = await fetch(API + '/likes', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ tx }),
    });
    const data = await res.json();
    if (!res.ok) {
      setStatus(data.error || 'like failed', 'error');
      return false;
    }

    // Compute and store the LikeBox ID for later unlike
    if (data.status === 'pending') {
      const likeBoxId = computeBoxId(tx.outputs[1]); // second output is the LikeBox
      likeBoxes.set(targetPostId, { likeBoxId, isFree: false });
    } else if (data.status === 'free') {
      likeBoxes.set(targetPostId, { likeBoxId: null, isFree: true, likeId: data.likeId });
    }

    return true;
  } catch (e) {
    setStatus('like error: ' + e.message, 'error');
    return false;
  }
}

async function doUnlike(targetPostId) {
  const stored = likeBoxes.get(targetPostId);
  if (!stored) {
    setStatus('No like record found for this post', 'error');
    return false;
  }

  try {
    const pubKeyHex = buf2hex(pubKeyRaw);

    if (stored.isFree) {
      // Free like — no LikeBox to consume. The client still sends a tx
      // for the server to deduct the 1-karma penalty.
      // For now, send a simple karma→karma tx with -1 penalty.
      const karmaBox = await fetchKarmaBox();
      if (!karmaBox) {
        setStatus('No karma box for unlike penalty', 'error');
        return false;
      }
      const now = currentBlockHeight;
      const tx = {
        inputs: [karmaBox.boxId],
        outputs: [{
          boxType: 'karma',
          value: karmaBox.balance - 1, // 1 karma penalty
          createdAtBlock: now,
          owner: pubKeyHex,
          guard: 'owner_signature',
          proofSource: 'unlike-free',
          lastTouchBlock: now,
        }],
        signatures: {},
        protocolVersion: PROTOCOL_VERSION,
      };
      const { signature } = await signTxId(tx);
      tx.signatures[pubKeyHex] = signature;

      const res = await fetch(API + '/likes/remove', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ tx }),
      });
      const data = await res.json();
      if (!res.ok) {
        setStatus(data.error || 'unlike failed', 'error');
        return false;
      }
      return true;
    } else {
      // Locked like — consume the LikeBox
      if (!stored.likeBoxId) {
        setStatus('No LikeBox ID stored for unlike', 'error');
        return false;
      }
      const tx = buildUnlikeTx(stored.likeBoxId, pubKeyHex);
      const { signature } = await signTxId(tx);
      tx.signatures[pubKeyHex] = signature;

      const res = await fetch(API + '/likes/remove', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ tx }),
      });
      const data = await res.json();
      if (!res.ok) {
        setStatus(data.error || 'unlike failed', 'error');
        return false;
      }
      return true;
    }
  } catch (e) {
    setStatus('unlike error: ' + e.message, 'error');
    return false;
  }
}

// ===========================================================================
// Feed
// ===========================================================================

function renderPost(p, id, depth) {
  const shortId = id.slice(0, 16);
  const liked = likedPosts.has(id);
  const likeCount = typeof p.likeCount === 'number' ? p.likeCount : 0;
  const indent = depth * 20;
  const isOwn = userId && p.author === userId;
  const deleteBtn = isOwn
    ? `<button class="like-btn delete-btn" data-post-id="${id}" style="color:#f85149">&#10005; Delete</button>`
    : '';
  return `
    <div class="post" data-post-id="${id}" style="margin-left:${indent}px;border-left:${depth > 0 ? '2px solid #30363d' : 'none'};padding-left:${depth > 0 ? '10px' : '12px'}">
      <div class="post-author">${esc(p.author.slice(0, 12))}...</div>
      <div class="post-content">${esc(p.content)}</div>
      <div class="post-meta">
        <span>${new Date(p.timestamp).toLocaleTimeString()}</span>
        <span>${p.parentRefs.length ? p.parentRefs.length + ' parent(s)' : 'genesis'}</span>
        <span style="font-family:monospace;font-size:10px">${esc(shortId)}...</span>
        <button class="like-btn reply-btn" data-post-id="${id}">&#8617; Reply</button>
        <button class="like-btn${liked ? ' liked' : ''}" data-post-id="${id}" data-liked="${liked ? '1' : '0'}">
          ${liked ? '&#10084;&#65039; Liked' : '&#10084;&#65039; Like'} (${likeCount})
        </button>
        ${deleteBtn}
      </div>
    </div>
  `;
}

function renderThread(roots, postMap, children, depth) {
  const sorted = [...roots].sort((a, b) => b.timestamp - a.timestamp);
  return sorted.map(p => {
    const id = computePostId(p);
    const childPosts = (children.get(id) || []).sort((a, b) => a.timestamp - b.timestamp);
    return renderPost(p, id, depth) + renderThread(childPosts, postMap, children, depth + 1);
  }).join('');
}

async function loadFeed() {
  const feed = document.getElementById('feed');
  try {
    const res = await fetch(API + '/posts?limit=50');
    const posts = await res.json();
    if (!posts.length) { feed.innerHTML = '<div class="empty">No posts yet. Write something!</div>'; return; }

    // Build post map and children index
    const postMap = new Map();
    const children = new Map();
    for (const p of posts) {
      const id = computePostId(p);
      postMap.set(id, p);
    }
    for (const p of posts) {
      const id = computePostId(p);
      for (const parentId of p.parentRefs) {
        if (postMap.has(parentId)) {
          if (!children.has(parentId)) children.set(parentId, []);
          children.get(parentId).push(p);
        }
      }
    }

    // Roots: posts whose parentRefs are empty or none are in the fetched set
    const rootPosts = posts.filter(p => {
      if (!p.parentRefs.length) return true;
      return !p.parentRefs.some(pid => postMap.has(pid));
    });

    feed.innerHTML = renderThread(rootPosts, postMap, children, 0) ||
      '<div class="empty">No root posts found. Try posting something!</div>';

    // Attach reply handlers
    feed.querySelectorAll('.reply-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const postId = btn.dataset.postId;
        if (!postId) return;
        const input = document.getElementById('parents');
        const current = input.value.trim();
        input.value = current ? current + ', ' + postId : postId;
        input.scrollIntoView({ behavior: 'smooth' });
        input.focus();
      });
    });

    // Attach like/unlike handlers
    feed.querySelectorAll('.like-btn:not(.reply-btn)').forEach(btn => {
      btn.addEventListener('click', async () => {
        const postId = btn.dataset.postId;
        const isLiked = btn.dataset.liked === '1';
        if (!postId) return;

        btn.disabled = true;
        btn.textContent = '...';

        if (isLiked) {
          const ok = await doUnlike(postId);
          if (ok) {
            likedPosts.delete(postId);
            likeBoxes.delete(postId);
            loadIdentityStatus();
          }
          btn.disabled = false;
          loadFeed();
        } else {
          const ok = await doLike(postId);
          if (ok) {
            likedPosts.add(postId);
            btn.classList.add('liked');
            btn.dataset.liked = '1';
            loadIdentityStatus();
          }
          btn.disabled = false;
          loadFeed();
        }
      });
    });

    // Attach delete handlers
    feed.querySelectorAll('.delete-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const postId = btn.dataset.postId;
        if (!postId || !userId || !privKey) return;

        if (!confirm('Delete this post and all replies? This will return any locked karma to each reply author.')) {
          return;
        }

        btn.disabled = true;
        btn.textContent = '...';

        try {
          // Get a challenge from the server
          const chalRes = await fetch(API + '/challenge', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ userId }),
          });
          if (!chalRes.ok) {
            throw new Error('Failed to get challenge');
          }
          const { challenge } = await chalRes.json();

          // Sign the challenge to prove authorship
          const chalBytes = hex2buf(challenge);
          const hash = blake2b(chalBytes, null, 64).slice(0, 32);
          const sigBuf = await crypto.subtle.sign('Ed25519', privKey, hash);
          const signature = buf2hex(new Uint8Array(sigBuf));

          const res = await fetch(API + '/posts/' + encodeURIComponent(postId), {
            method: 'DELETE',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ authorId: userId, challenge, signature }),
          });

          if (!res.ok) {
            const err = await res.json();
            throw new Error(err.error || 'Delete failed');
          }

          const result = await res.json();
          console.log('Post deleted:', result);
          loadFeed();
        } catch (e) {
          console.error('Delete failed:', e);
          alert('Delete failed: ' + (e.message || 'unknown error'));
          btn.disabled = false;
          btn.textContent = '✕ Delete';
        }
      });
    });
  } catch (e) {
    feed.innerHTML = '<div class="empty">Failed to load feed</div>';
  }
}

async function loadIdentityStatus() {

    } else {
      karmaEl.textContent = '0';
      karmaEl.style.color = '#8b949e';
    }
  } catch {
    karmaEl.textContent = '—';
    karmaEl.style.color = '#8b949e';
  }

  try {
    const res = await fetch(API + '/credits/' + encodeURIComponent(userId));
    if (res.ok) {
      const data = await res.json();
      creditsEl.textContent = data.total;
      creditsEl.style.color = data.total > 0 ? '#3fb950' : '#8b949e';
    } else {
      creditsEl.textContent = '0';
      creditsEl.style.color = '#8b949e';
    }
  } catch {
    creditsEl.textContent = '—';
    creditsEl.style.color = '#8b949e';

function buildCreditTransferTx(creditBoxes, recipientHex, amount) {
  const now = currentBlockHeight;
  const unlocked = creditBoxes.boxes.filter(b =>
    !b.lockedUntilBlock || b.lockedUntilBlock <= currentBlockHeight
  );
  const selected = selectBoxes(unlocked, amount);
  const selectedTotal = selected.reduce((sum, b) => sum + b.value, 0);
  const change = selectedTotal - amount;

  const outputs = [{
    boxType: 'credit',
    value: amount,
    createdAtBlock: now,
    owner: recipientHex,
    guard: 'owner_signature',
    proofSource: -1,
  }];
  if (change > 0) {
    outputs.push({
      boxType: 'credit',
      value: change,
      createdAtBlock: now,
      owner: buf2hex(pubKeyRaw),
      guard: 'owner_signature',
      proofSource: -1,
    });
  }

  return {
    inputs: selected.map(b => b.boxId),
    outputs,
    signatures: {},
    protocolVersion: PROTOCOL_VERSION,
  };
}

document.getElementById('creditTransferBtn').addEventListener('click', async () => {
  const btn = document.getElementById('creditTransferBtn');
  const result = document.getElementById('creditTransferResult');
  const recipient = document.getElementById('creditTransferRecipient').value.trim();
  const amount = parseInt(document.getElementById('creditTransferAmount').value) || 0;

  if (!recipient || recipient.length !== 64) {
    result.innerHTML = '<span class="result-msg err">Recipient must be a 64-character hex user ID</span>';
    return;
  }
  if (amount < 1) {
    result.innerHTML = '<span class="result-msg err">Amount must be at least 1</span>';
    return;
  }

  btn.disabled = true;
  result.innerHTML = '<span class="result-msg">Building transaction...</span>';

  try {
    const creditBoxes = await fetchCreditBoxes();
    if (!creditBoxes || creditBoxes.total < amount) {
      result.innerHTML = `<span class="result-msg err">Insufficient credits: have ${creditBoxes?.total || 0}, need ${amount}</span>`;
      btn.disabled = false;
      return;
    }

    const tx = buildCreditTransferTx(creditBoxes, recipient, amount);
    const { signature } = await signTxId(tx);
    const pubKeyHex = buf2hex(pubKeyRaw);
    tx.signatures[pubKeyHex] = signature;

    // Convert hex signature to base64 for the API
    const sigBytes = hex2buf(signature);
    const sigBase64 = btoa(String.fromCharCode(...sigBytes));

    const res = await fetch(API + '/credits/transfer', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        from: userId,
        to: recipient,
        amount,
        signature: sigBase64,
        expectedHeight: currentBlockHeight,
      }),
    });

    const data = await res.json();
    if (res.ok) {
      result.innerHTML = `<span class="result-msg ok">Sent ${data.sent} credits${data.change > 0 ? ' (change: ' + data.change + ')' : ''}. TxId: ${(data.txId || '').slice(0, 16)}...</span>`;
      loadIdentityStatus();
      loadStatus();
    } else {
      result.innerHTML = `<span class="result-msg err">${esc(data.error || 'transfer failed')}</span>`;
    }
  } catch (e) {
    result.innerHTML = `<span class="result-msg err">${esc(e.message)}</span>`;
  } finally {
    btn.disabled = false;
  }
});

document.getElementById('createInviteBtn').addEventListener('click', async () => {
  const btn = document.getElementById('createInviteBtn');
  const result = document.getElementById('inviteResult');

  btn.disabled = true;
  result.innerHTML = '<span class="result-msg">Creating invite...</span>';

  try {
    // 1. Fetch karma box
    const karmaBox = await fetchKarmaBox();
    if (!karmaBox) {
      result.innerHTML = '<span class="result-msg err">No karma box found</span>';
      return;
    }
    const totalNeeded = INVITE_KARMA_AMOUNT + INVITE_BOND_KARMA;
    if (karmaBox.total < totalNeeded) {
      result.innerHTML = `<span class="result-msg err">Insufficient karma: need ${totalNeeded}, have ${karmaBox.total}</span>`;
      return;
    }

    // 2. Generate random secret and compute secretHash
    const secretBytes = crypto.getRandomValues(new Uint8Array(32));
    const secretHex = buf2hex(secretBytes);
    const secretHash = blake2b(secretBytes, null, 64).slice(0, 32);
    const secretHashHex = buf2hex(secretHash);

    // 3. Build and sign tx
    const pubKeyHex = buf2hex(pubKeyRaw);
    const tx = buildCreateInviteTx(karmaBox, pubKeyHex, secretHashHex);
    const { signature } = await signTxId(tx);
    tx.signatures[pubKeyHex] = signature;

    // 4. Submit
    const res = await fetch(API + '/invites', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ tx }),
    });
    const data = await res.json();
    if (res.ok) {
      result.innerHTML = `
        <span class="result-msg ok">Invite created!</span>
        <div style="font-size:11px;color:#8b949e;margin:4px 0">Invite Box ID:</div>
        <pre>${esc(data.inviteBoxId)}</pre>
        <div style="font-size:11px;color:#8b949e;margin:4px 0">Bond Box ID:</div>
        <pre>${esc(data.bondBoxId)}</pre>
        <div style="font-size:11px;color:#8b949e;margin:4px 0">Inviter ID:</div>
        <pre>${esc(pubKeyHex)}</pre>
        <div style="font-size:11px;color:#8b949e;margin:4px 0">Secret (share with invitee):</div>
        <pre>${esc(secretHex)}</pre>
        <div style="font-size:11px;color:#8b949e;margin:4px 0">Secret Hash (for verification):</div>
        <pre>${esc(secretHashHex)}</pre>
      `;
      loadStatus();
      loadIdentityStatus();
    } else {
      result.innerHTML = `<span class="result-msg err">${esc(data.error || 'invite creation failed')}</span>`;
    }
  } catch (e) {
    result.innerHTML = `<span class="result-msg err">${esc(e.message)}</span>`;
  } finally {
    btn.disabled = false;
  }
});

document.getElementById('redeemInviteBtn').addEventListener('click', async () => {
  const btn = document.getElementById('redeemInviteBtn');
  const result = document.getElementById('redeemResult');
  const inviteBoxId = document.getElementById('inviteBoxIdInput').value.trim();
  const bondBoxId = document.getElementById('bondBoxIdForClaimInput').value.trim();
  const inviterId = document.getElementById('inviterIdForClaimInput').value.trim();
  const secretHex = document.getElementById('inviteSecretInput').value.trim();

  if (!inviteBoxId || !bondBoxId || !inviterId || !secretHex) {
    result.innerHTML = '<span class="result-msg err">All fields are required</span>';
    return;
  }

  btn.disabled = true;

  try {
    const inviteePubKeyHex = buf2hex(pubKeyRaw);

    const inviteBox = { id: inviteBoxId, value: INVITE_KARMA_AMOUNT, inviterId };

    // ---- Step 1: Commit ----
    result.innerHTML = '<span class="result-msg">Committing...</span>';

    const bondBox = {
      id: bondBoxId,
      value: INVITE_BOND_KARMA,
      inviterId,
      inviteBoxId: inviteBoxId,
    };

    const commitTx = buildCommitTx(bondBox, inviteePubKeyHex, secretHex);
    const { signature: commitSig } = await signTxId(commitTx);
    commitTx.signatures[inviteePubKeyHex] = commitSig;

    const commitRes = await fetch(API + '/invites/commit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ tx: commitTx }),
    });
    const commitData = await commitRes.json();
    if (!commitRes.ok) {
      result.innerHTML = `<span class="result-msg err">Commit failed: ${esc(commitData.error || 'unknown error')}</span>`;
      return;
    }

    // Persist probation timers set during commit (block height at commit time)
    bondBox.probationStartBlock = currentBlockHeight;
    bondBox.probationEndBlock = currentBlockHeight + INVITE_PROBATION_BLOCKS;

    // Store secret for reveal step (survives page refresh)
    sessionStorage.setItem('reveal_' + inviteBoxId, JSON.stringify({
      secretHex,
      bondBoxId,
      inviterId,
      inviteePubKeyHex,
      bondInviteBoxId: inviteBoxId,
    }));

    // ---- Step 2: Wait then reveal ----
    result.innerHTML = '<span class="result-msg">Committed — waiting for block inclusion...</span>';

    // Poll for block height change (or use fixed delay)
    const startHeight = currentBlockHeight;
    const checkReveal = async () => {
      await loadStatus(); // refreshes currentBlockHeight
      if (currentBlockHeight > startHeight) {
        // Block advanced — proceed to reveal
        result.innerHTML = '<span class="result-msg">Revealing...</span>';

        const revealTx = buildClaimInviteTx(inviteBox, bondBox, inviteePubKeyHex, secretHex);
        const { signature: revealSig } = await signTxId(revealTx);
        revealTx.signatures[inviteePubKeyHex] = revealSig;

        const revealRes = await fetch(API + '/invites/claim', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ tx: revealTx }),
        });
        const revealData = await revealRes.json();
        if (revealRes.ok) {
          sessionStorage.removeItem('reveal_' + inviteBoxId);
          result.innerHTML = `
            <span class="result-msg ok">Invite claimed!</span>
            <div style="font-size:11px;color:#8b949e;margin:4px 0">User ID:</div>
            <pre>${esc(revealData.userId)}</pre>
            <div style="font-size:11px;color:#8b949e;margin:4px 0">Karma Box ID:</div>
            <pre>${esc(revealData.karmaBoxId)}</pre>
          `;
          loadStatus();
          loadIdentityStatus();
        } else {
          result.innerHTML = `<span class="result-msg err">Reveal failed: ${esc(revealData.error || 'unknown error')}</span>`;
        }
      } else {
        // Not yet — poll again in 5 seconds
        setTimeout(checkReveal, 5000);
      }
    };

    setTimeout(checkReveal, 3000); // Start polling after 3s
  } catch (e) {
    result.innerHTML = `<span class="result-msg err">${esc(e.message)}</span>`;
  } finally {
    btn.disabled = false;
  }
});

document.getElementById('cancelInviteBtn').addEventListener('click', async () => {
  const btn = document.getElementById('cancelInviteBtn');
  const result = document.getElementById('cancelInviteResult');
  const inviteBoxId = document.getElementById('cancelInviteBoxIdInput').value.trim();

  if (!inviteBoxId) {
    result.innerHTML = '<span class="result-msg err">Invite Box ID is required</span>';
    return;
  }

  btn.disabled = true;
  result.innerHTML = '<span class="result-msg">Cancelling invite...</span>';

  try {
    // Fetch karma box and invite state to build the cancel tx
    const karmaBox = await fetchKarmaBox();
    if (!karmaBox) {
      result.innerHTML = '<span class="result-msg err">No karma box found</span>';
      return;
    }

    const inviteState = await fetchInviteState();
    const invBox = inviteState.pending.find(b => b.id === inviteBoxId);
    if (!invBox) {
      result.innerHTML = `<span class="result-msg err">Invite ${inviteBoxId.slice(0, 16)}... not found in your pending invites</span>`;
      return;
    }

    // Find the matching bond box (same inviterId, unclaimed)
    const bondBox = inviteState.bonds.find(b =>
      b.inviterId === invBox.inviterId &&
      (!b.inviteePublicKey || b.inviteePublicKey === '00'.repeat(32))
    );

    const pubKeyHex = buf2hex(pubKeyRaw);
    const tx = buildCancelInviteTx(
      karmaBox,
      { id: invBox.id, value: invBox.value },
      { id: bondBox?.id || '00'.repeat(32), value: bondBox?.value || 0 },
      pubKeyHex,
    );
    const { signature } = await signTxId(tx);
    tx.signatures[pubKeyHex] = signature;

    const res = await fetch(API + '/invites/cancel', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ tx }),
    });
    const data = await res.json();
    if (res.ok) {
      result.innerHTML = `<span class="result-msg ok">Invite cancelled! TxId: ${(data.txId || '').slice(0, 16)}...</span>`;
      loadStatus();
      loadIdentityStatus();
    } else {
      result.innerHTML = `<span class="result-msg err">${esc(data.error || 'cancel failed')}</span>`;
    }
  } catch (e) {
    result.innerHTML = `<span class="result-msg err">${esc(e.message)}</span>`;
  } finally {
    btn.disabled = false;
  }
});
