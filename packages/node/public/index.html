<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notis DEMO UI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#020D07; --bg-2:#06190F; --bg-3:#082514;
  --p:#2CFF87; --on-p:#01160B;
  --p-hi:#D6FFEA; --p-md:#A6E7C6; --p-lo:#57B084; --p-dk:#1A6B40;
  --p-04:rgba(44,255,135,.055); --p-08:rgba(44,255,135,.10); --p-30:rgba(44,255,135,.34);
  --amber:#FFB000; --amber-bd:rgba(255,176,0,.35); --amber-bg:rgba(255,176,0,.08);
  --red:#FF4E3A; --red-bd:rgba(255,78,58,.42); --red-bg:rgba(255,78,58,.05); --on-red:#160302;
  --glow-accent:0 0 8px rgba(44,255,135,.42);
  --glow-strong:0 0 18px rgba(44,255,135,.4);
  --glow-input:0 0 0 1px var(--p-30),0 0 14px rgba(44,255,135,.12);
  --panel-grad:linear-gradient(160deg,rgba(44,255,135,.03),rgba(1,10,5,.35));
  --post-grad:linear-gradient(155deg,rgba(44,255,135,.05),rgba(3,18,10,.4) 60%,rgba(1,10,5,.5));
  --scan:rgba(0,0,0,.10);
  --vig-shadow:inset 0 0 150px rgba(0,0,0,.5),inset 0 0 70px rgba(44,255,135,.06);
  --vig-grad:radial-gradient(130% 100% at 50% 40%,transparent 60%,rgba(0,0,0,.3));
  --m:"JetBrains Mono",ui-monospace,"Cascadia Mono","SF Mono",Menlo,Consolas,monospace;
}
:root[data-theme="light"]{
  --bg:#EDF3EE; --bg-2:#E4EDE6; --bg-3:#DBE7DE;
  --p:#0B8A46; --on-p:#F4FBF6;
  --p-hi:#0B2C1B; --p-md:#26493A; --p-lo:#557460; --p-dk:#CBDDD0;
  --p-04:rgba(11,138,70,.05); --p-08:rgba(11,138,70,.09); --p-30:rgba(11,138,70,.30);
  --amber:#9A6000; --amber-bd:rgba(154,96,0,.4); --amber-bg:rgba(154,96,0,.08);
  --red:#C22E1C; --red-bd:rgba(194,46,28,.4); --red-bg:rgba(194,46,28,.06); --on-red:#FCEDEB;
  --glow-accent:none;
  --glow-strong:0 6px 16px rgba(11,138,70,.20);
  --glow-input:0 0 0 1px var(--p-30);
  --panel-grad:linear-gradient(160deg,rgba(11,138,70,.05),rgba(237,243,238,.55));
  --post-grad:linear-gradient(155deg,rgba(11,138,70,.05),rgba(228,237,230,.55) 60%,rgba(219,231,222,.7));
  --scan:rgba(11,42,27,.035);
  --vig-shadow:inset 0 0 120px rgba(11,42,27,.045);
  --vig-grad:none;
}
@media(prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --bg:#EDF3EE; --bg-2:#E4EDE6; --bg-3:#DBE7DE;
    --p:#0B8A46; --on-p:#F4FBF6;
    --p-hi:#0B2C1B; --p-md:#26493A; --p-lo:#557460; --p-dk:#CBDDD0;
    --p-04:rgba(11,138,70,.05); --p-08:rgba(11,138,70,.09); --p-30:rgba(11,138,70,.30);
    --amber:#9A6000; --amber-bd:rgba(154,96,0,.4); --amber-bg:rgba(154,96,0,.08);
    --red:#C22E1C; --red-bd:rgba(194,46,28,.4); --red-bg:rgba(194,46,28,.06); --on-red:#FCEDEB;
    --glow-accent:none; --glow-strong:0 6px 16px rgba(11,138,70,.20); --glow-input:0 0 0 1px var(--p-30);
    --panel-grad:linear-gradient(160deg,rgba(11,138,70,.05),rgba(237,243,238,.55));
    --post-grad:linear-gradient(155deg,rgba(11,138,70,.05),rgba(228,237,230,.55) 60%,rgba(219,231,222,.7));
    --scan:rgba(11,42,27,.035); --vig-shadow:inset 0 0 120px rgba(11,42,27,.045); --vig-grad:none;
  }
}

*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--p-md);font-family:var(--m);font-size:13.5px;line-height:1.6;
  display:flex;height:100vh;overflow:hidden;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
body::before{content:"";position:fixed;inset:0;z-index:900;pointer-events:none;
  background:repeating-linear-gradient(0deg,var(--scan) 0,var(--scan) 1px,transparent 1px,transparent 3px);mix-blend-mode:multiply}
body::after{content:"";position:fixed;inset:0;z-index:901;pointer-events:none;box-shadow:var(--vig-shadow);background:var(--vig-grad)}
::selection{background:var(--p);color:var(--on-p)}
a{color:inherit;text-decoration:none}
:focus-visible{outline:1px solid var(--p);outline-offset:2px}
.panel::-webkit-scrollbar{width:9px}
.panel::-webkit-scrollbar-thumb{background:var(--p-dk)}
.panel::-webkit-scrollbar-track{background:transparent}

.panel{padding:22px;overflow-y:auto;position:relative;z-index:2}
.left{width:430px;min-width:430px;border-right:1px solid var(--p-dk);display:flex;flex-direction:column;gap:15px;background:var(--panel-grad)}
.left>*{flex-shrink:0}
.right{flex:1}

.brand{display:flex;align-items:center;gap:10px;padding-bottom:14px;border-bottom:1px solid var(--p-dk)}
.brand svg{width:22px;height:22px;filter:drop-shadow(0 0 6px rgba(44,255,135,.5))}
:root[data-theme="light"] .brand svg{filter:none}
.brand b{font-size:15px;font-weight:800;letter-spacing:.08em;color:var(--p-hi)}
.brand b i{font-style:normal;color:var(--p)}
.brand .tag{margin-left:auto;font-size:9px;letter-spacing:.24em;text-transform:uppercase;color:var(--p-lo)}
.brand .tag u{width:6px;height:6px;border-radius:50%;background:var(--p);display:inline-block;box-shadow:0 0 8px var(--p);margin-right:6px;vertical-align:1px;animation:blip 2.2s infinite}
@keyframes blip{0%,100%{opacity:1}50%{opacity:.35}}

.theme-toggle{position:fixed;top:14px;right:16px;z-index:950;width:38px;height:38px;padding:0;
  display:inline-flex;align-items:center;justify-content:center;font-size:16px;line-height:1;letter-spacing:0;
  border:1px solid #B4D3C1;background:#EDF3EE;color:#0B8A46;cursor:pointer;
  box-shadow:0 2px 12px rgba(0,0,0,.35);transition:transform .2s,box-shadow .2s,filter .2s}
.theme-toggle::before{content:none}
.theme-toggle:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(0,0,0,.45);filter:brightness(1.06)}
:root[data-theme="light"] .theme-toggle{background:#020D07;color:#2CFF87;border-color:#1F6B41}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]) .theme-toggle{background:#020D07;color:#2CFF87;border-color:#1F6B41}}

h2{font-size:10px;font-weight:700;letter-spacing:.26em;text-transform:uppercase;color:var(--p);margin-bottom:8px;display:flex;align-items:center;gap:9px}
h2::before{content:"//";color:var(--p-lo)}
h3{font-size:9.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--p-lo);margin:11px 0 4px}
h4{font-size:10px;letter-spacing:.05em;color:var(--p-lo);margin:8px 0 3px;font-weight:600}

textarea,input,select{width:100%;background:var(--bg-2);border:1px solid var(--p-dk);color:var(--p-md);font-size:12.5px;font-family:var(--m);padding:10px 11px;transition:border-color .2s,box-shadow .2s}
textarea{height:120px;min-height:120px;resize:vertical;line-height:1.55}
input,select{height:36px}
select{cursor:pointer}
textarea:focus,input:focus,select:focus{outline:none;border-color:var(--p-30);box-shadow:var(--glow-input)}
::placeholder{color:var(--p-lo);opacity:.75}

button{display:inline-flex;align-items:center;gap:6px;font-family:var(--m);font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;padding:9px 15px;border:1px solid var(--p-30);color:var(--p);background:var(--p-04);cursor:pointer;transition:background .22s,color .22s,border-color .22s,box-shadow .22s,transform .22s cubic-bezier(.16,.84,.32,1)}
button::before{content:">";opacity:.65}
button:hover{background:var(--p);color:var(--on-p);border-color:var(--p);box-shadow:var(--glow-strong);transform:translateY(-1px)}
button:disabled{opacity:.32;cursor:not-allowed;transform:none;box-shadow:none;background:var(--p-04);color:var(--p)}
button.small{padding:6px 10px;font-size:9px;letter-spacing:.14em}
button.danger{border-color:var(--red-bd);color:var(--red);background:var(--red-bg)}
button.danger::before{content:"!"}
button.danger:hover{background:var(--red);color:var(--on-red);border-color:var(--red);box-shadow:none}

.id-badge{font-size:10.5px;color:var(--p-lo);background:var(--bg-2);border:1px solid var(--p-dk);padding:9px 10px;word-break:break-all;letter-spacing:.02em}
.post-author,.id-badge{font-family:var(--m)}
.status-bar{background:var(--bg-2);border:1px solid var(--p-dk);padding:11px 12px;font-size:11.5px;line-height:1.75}
.status-bar span{color:var(--p-lo)}
.status-bar strong{color:var(--p-hi);font-weight:600}

.status{font-size:9px;letter-spacing:.14em;text-transform:uppercase;padding:3px 9px;border:1px solid}
.status-ok{color:var(--p);border-color:var(--p-30);background:var(--p-08)}
.status-busy{color:var(--amber);border-color:var(--amber-bd);background:var(--amber-bg)}
.status-error{color:var(--red);border-color:var(--red-bd);background:var(--red-bg)}

.empty{color:var(--p-lo);font-style:italic;padding:22px;text-align:center;letter-spacing:.04em}
.row{display:flex;gap:8px;align-items:center}
.row label{font-size:12px;color:var(--p-lo);white-space:nowrap}

.like-btn{display:inline-flex;align-items:center;gap:5px;background:none;border:1px solid var(--p-dk);color:var(--p-lo);cursor:pointer;font-size:11px;font-family:var(--m);letter-spacing:.04em;padding:2px 9px;text-transform:none;transition:border-color .2s,color .2s,background .2s}
.like-btn::before{content:none}
.like-btn:hover{border-color:var(--p-30);color:var(--p);background:var(--p-04);box-shadow:none;transform:none}
.like-btn:disabled{opacity:.4;cursor:not-allowed}
.like-btn.liked{border-color:var(--p);color:var(--p);background:var(--p-08);text-shadow:var(--glow-accent)}
.like-btn .spinner{display:inline-block;width:10px;height:10px;border:2px solid var(--p-dk);border-top-color:var(--p);border-radius:50%;animation:spin .6s linear infinite;margin-right:4px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}

pre{background:var(--bg-2);border:1px solid var(--p-dk);padding:9px 10px;font-size:10.5px;font-family:var(--m);color:var(--p);overflow-x:auto;white-space:pre-wrap;word-break:break-all;margin:5px 0;line-height:1.7}
.result-msg{font-size:10.5px;padding:4px 0;color:var(--p-lo);letter-spacing:.02em}
.result-msg.ok{color:var(--p)}
.result-msg.err{color:var(--red)}
hr{border:none;border-top:1px solid var(--p-dk);margin:6px 0}

.post{position:relative;border:1px solid var(--p-dk);padding:14px 16px;margin-bottom:11px;background:var(--post-grad);transition:border-color .3s,box-shadow .3s}
.post::before,.post::after{content:"";position:absolute;width:9px;height:9px;pointer-events:none}
.post::before{top:-1px;left:-1px;border-top:1px solid var(--p);border-left:1px solid var(--p)}
.post::after{bottom:-1px;right:-1px;border-bottom:1px solid var(--p);border-right:1px solid var(--p)}
.post:hover{border-color:var(--p-30);box-shadow:var(--glow-strong)}
.post-author{font-size:10.5px;color:var(--p);letter-spacing:.04em;margin-bottom:7px;text-shadow:var(--glow-accent)}
.post-content{font-size:13.5px;line-height:1.56;color:var(--p-hi);font-weight:300}
:root[data-theme="light"] .post-content{font-weight:400}
.post-meta{font-size:10px;color:var(--p-lo);margin-top:11px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;letter-spacing:.03em}

.permalink{color:var(--p-lo);text-decoration:none;cursor:pointer}
.permalink:hover{color:var(--p);text-decoration:underline}
.post-highlighted{border-color:var(--amber)!important}
.thread-header{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.thread-header h2{margin-bottom:0}
.ancestor-post{opacity:.72}
.ancestor-connector{color:var(--p-lo);font-size:10px;padding:2px 0 2px 12px;border-left:2px solid var(--p-dk);margin-left:0}

@media(max-width:768px){
  body{flex-direction:column;height:auto;min-height:100vh;overflow:auto}
  .left{width:100%;min-width:0;border-right:none;border-bottom:1px solid var(--p-dk);flex-shrink:0}
  .right{flex:none}
  .panel{overflow-y:visible}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<button class="theme-toggle" id="themeToggle" title="Toggle light / dark" aria-label="Toggle theme">☀</button>

<div class="panel left">
  <div class="brand">
    <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
      <circle cx="16" cy="5"  r="2.6" fill="#2CFF87"/>
      <circle cx="6"  cy="16" r="2"   fill="#2CFF87" opacity=".8"/>
      <circle cx="26" cy="16" r="2"   fill="#2CFF87" opacity=".8"/>
      <circle cx="11" cy="27" r="1.7" fill="#2CFF87" opacity=".5"/>
      <circle cx="22" cy="27" r="1.7" fill="#2CFF87" opacity=".5"/>
      <path d="M16 7.6 6 13.9M16 7.6 26 13.9M6 18 11 25M26 18 22 25" stroke="#2CFF87" stroke-width="1.1" opacity=".55"/>
    </svg>
    <b>NOTIS<i>//</i></b>
    <span class="tag"><u></u>testnet</span>
  </div>
  <h2>Identity</h2>
  <div class="row">
    <select id="identitySelect"></select>
  </div>
  <div class="row">
    <button id="newIdentityBtn" class="small">+ New</button>
    <button id="importIdentityBtn" class="small">Import</button>
    <button id="exportIdentityBtn" class="small">Export</button>
  </div>
  <input type="file" id="importFileInput" accept=".json" style="display:none">
  <div class="id-badge" id="currentUserId">loading...</div>
  <div class="status-bar" id="identityStatus" style="margin-top:8px">
    <div><span>Karma:</span> <strong id="identityKarma">—</strong></div>
    <div><span>Credits:</span> <strong id="identityCredits">—</strong></div>
  </div>

  <h2>Compose</h2>
  <textarea id="content" placeholder="What's on your mind?"></textarea>
  <input id="parents" placeholder="Parent post IDs (comma-separated, optional)">
  <div class="row">
    <button id="postBtn" disabled>Post</button>
    <span class="status" id="postStatus"></span>
  </div>

  <h2>Node Status</h2>
  <div class="status-bar" id="statusBar">Loading...</div>

  <div id="adminSection" style="display:none">
    <hr>
    <h2>Admin / Debug</h2>

    <h3>Faucet</h3>
    <div class="row">
      <input id="faucetAmount" type="number" value="100" min="1" max="1000" style="width:100px">
      <button id="faucetBtn" class="small">Grant</button>
    </div>
    <div id="faucetResult"></div>

    <h3>Credit Faucet</h3>
    <div class="row">
      <button id="creditFaucetBtn" class="small">Get 1000 credits</button>
    </div>
    <div id="creditFaucetResult"></div>

    <h3>Credit Transfer</h3>
    <div class="row">
      <input id="creditTransferRecipient" placeholder="Recipient user ID (hex)" style="flex:1;font-size:11px">
    </div>
    <div class="row" style="margin-top:4px">
      <input id="creditTransferAmount" type="number" value="10" min="1" style="width:120px">
      <button id="creditTransferBtn" class="small">Send</button>
    </div>
    <div id="creditTransferResult"></div>

    <h3>Invites</h3>
    <h4>Create (fixed: 25 karma + 25 bond)</h4>
    <div class="row">
      <button id="createInviteBtn" class="small">Create Invite</button>
    </div>
    <div id="inviteResult"></div>

    <h4>Redeem</h4>
    <div style="font-size:11px;color:var(--p-lo);margin:4px 0 2px">Invite Box ID:</div>
    <div class="row">
      <input id="inviteBoxIdInput" placeholder="Invite Box ID" style="flex:1;font-size:11px">
    </div>
    <div style="font-size:11px;color:var(--p-lo);margin:4px 0 2px">Bond Box ID:</div>
    <div class="row" style="margin-top:2px">
      <input id="bondBoxIdForClaimInput" placeholder="Bond Box ID" style="flex:1;font-size:11px">
    </div>
    <div style="font-size:11px;color:var(--p-lo);margin:4px 0 2px">Inviter ID (hex):</div>
    <div class="row" style="margin-top:2px">
      <input id="inviterIdForClaimInput" placeholder="Inviter ID (hex)" style="flex:1;font-size:11px">
    </div>
    <div style="font-size:11px;color:var(--p-lo);margin:4px 0 2px">Secret (hex):</div>
    <div class="row" style="margin-top:2px">
      <input id="inviteSecretInput" placeholder="Secret (hex)" style="flex:1;font-size:11px">
      <button id="redeemInviteBtn" class="small">Redeem</button>
    </div>
    <div id="redeemResult"></div>

    <h4>Cancel Invite</h4>
    <div class="row">
      <input id="cancelInviteBoxIdInput" placeholder="Invite Box ID" style="flex:1;font-size:11px">
      <button id="cancelInviteBtn" class="small danger">Cancel</button>
    </div>
    <div id="cancelInviteResult"></div>
  </div>
</div>

<div class="panel right">
  <div id="profileBar" class="status-bar" style="display:none;margin-bottom:12px;align-items:center;gap:8px">
    <span><strong id="profileName"></strong></span>
    <button id="vouchBtn" class="small" style="display:none">Vouch</button>
    <button id="unvouchBtn" class="small danger" style="display:none">Unvouch</button>
    <span id="vouchStatus" style="font-size:11px"></span>
    <button id="profileBackBtn" class="small" style="margin-left:auto">← All posts</button>
  </div>
  <h2>Feed <button id="feedFilterBtn" class="small" style="margin-left:8px;font-size:10px">All posts</button></h2>
  <div id="feed"><div class="empty">Loading...</div></div>
</div>

<script type="module">
import { blake2b } from 'https://cdn.jsdelivr.net/npm/blakejs@1.2.1/+esm';

// Auto-detect: behind nginx with /testnet/ prefix, or direct node access
const API = window.location.pathname.startsWith('/testnet') ? '/testnet/api' : '';
const encoder = new TextEncoder();

// ===========================================================================
// Protocol constants (mirrored from @dagsocial/types constants.ts)
// ===========================================================================

const PROTOCOL_VERSION = 1;
// Amount constants are bigint (box values are bigint — Spec B P0); block
// counts stay plain numbers. Mirrors @dagsocial/types constants.ts.
const LIKE_COST = 2n;
const POST_LOCK_THREAD_COST = 5n;
const POST_LOCK_REPLY_COST = 3n;
const INVITE_KARMA_AMOUNT = 25n;
const INVITE_BOND_KARMA = 25n;
const INVITE_PROBATION_BLOCKS = 1000;
/** Credits are 8-decimal: 10⁸ base units (10⁻⁸ credit) per displayed credit. */
const CREDIT_SCALE = 100000000n;

/** JSON.stringify replacer: bigint → decimal string (JSON cannot carry bigint). */
function jsonBigint(_k, v) { return typeof v === 'bigint' ? v.toString() : v; }

/** Render credit base units as whole credits, trimming trailing zero decimals. */
function formatCredits(baseUnits) {
  const whole = baseUnits / CREDIT_SCALE;
  const frac = baseUnits % CREDIT_SCALE;
  if (frac === 0n) return whole.toString();
  return whole.toString() + '.' + frac.toString().padStart(8, '0').replace(/0+$/, '');
}

// ===========================================================================
// State
// ===========================================================================

const STORAGE_KEY = 'dagsocial-identities';
let identities = [];
let activeIndex = -1;
let userId, pubKeyRaw, privKey;
let networkMode = 'mainnet';
/** Feed filter: 'all' or the hex userId to show only that author's posts. */
let feedFilter = 'all';
/** Set of post IDs with a pending like/unlike tx (spinner shown). */
const pendingLikes = new Set();
/** Map of targetPostId → { likeBoxId, isFree } for unlike */
const likeBoxes = new Map();
/** Current block height from /status */
let currentBlockHeight = 0;

// ===========================================================================
// Hex / byte utilities
// ===========================================================================

function buf2hex(buf) {
  return [...buf].map(b => b.toString(16).padStart(2, '0')).join('');
}

function hex2buf(hex) {
  const bytes = new Uint8Array(hex.length / 2);
  for (let i = 0; i < hex.length; i += 2) {
    bytes[i / 2] = parseInt(hex.substring(i, i + 2), 16);
  }
  return bytes;
}

function concatUint8Arrays(arrays) {
  const totalLength = arrays.reduce((s, a) => s + a.length, 0);
  const result = new Uint8Array(totalLength);
  let offset = 0;
  for (const a of arrays) {
    result.set(a, offset);
    offset += a.length;
  }
  return result;
}

// ===========================================================================
// Canonical post field encoding (audit M-1)
// ===========================================================================
//
// Byte-identical mirror of postFieldBytes() in @dagsocial/types (src/post.ts).
// See contracts/TYPES_INTERFACE.md → "Canonical field encoding (M-1)".
//
// The old encoding concatenated fields with no delimiters, so distinct field
// tuples collided — (powNonce=5, timestamp=23) and (52, 3) both produced
// …"5""23"… == …"52""3"… → the same postId. Every variable-length field is now
// length-prefixed and the ref array carries an explicit count.
//
// A post mined here must verify on the node, so ANY change below must land in
// packages/types/src/post.ts in the same commit. The golden vector frozen in
// the types tests (and re-asserted against this file by the node package's
// ui-crypto-mirror test) is the anchor that catches drift.

const POST_ID_DOMAIN = encoder.encode('dagsocial/post-id/1');

/**
 * Sentinel for a numeric field outside the encodable domain. The encoders are
 * total — they never throw — and the encodable domain is the non-negative safe
 * integers, whose top 11 bits are always zero, so no valid value can encode to
 * all-ones.
 */
const U32_SENTINEL = 0xffffffff;

function isEncodableU32(n) {
  return typeof n === 'number' && Number.isSafeInteger(n) && n >= 0 && n < U32_SENTINEL;
}

function isEncodableU64(n) {
  return typeof n === 'number' && Number.isSafeInteger(n) && n >= 0;
}

/** u32LE(n) — 4-byte little-endian. */
function encodeU32LE(n) {
  const v = isEncodableU32(n) ? n : U32_SENTINEL;
  return new Uint8Array([v & 0xff, (v >>> 8) & 0xff, (v >>> 16) & 0xff, (v >>> 24) & 0xff]);
}

/** u64LE(n) — 8-byte little-endian. The sole u64 encoder (PoW nonce + fields). */
function encodeLE64(n) {
  if (!isEncodableU64(n)) return new Uint8Array(8).fill(0xff);
  const lo = n >>> 0;
  const hi = Math.floor(n / 0x100000000) >>> 0;
  return new Uint8Array([
    lo & 0xff, (lo >>> 8) & 0xff, (lo >>> 16) & 0xff, (lo >>> 24) & 0xff,
    hi & 0xff, (hi >>> 8) & 0xff, (hi >>> 16) & 0xff, (hi >>> 24) & 0xff,
  ]);
}

/** LP(bytes) = u32LE(byteLength) ‖ bytes. */
function lengthPrefixed(bytes) {
  return concatUint8Arrays([encodeU32LE(bytes.length), bytes]);
}

/**
 * postFieldBytes — the canonical, injective encoding shared by the signing
 * hash, the PoW preimage, and the post id. Excludes powNonce (the author signs
 * before mining) and signature.
 */
function postFieldBytes(content, authorBytes, parentRefs, challengeBytes, protocolVersion, timestamp) {
  return concatUint8Arrays([
    lengthPrefixed(encoder.encode(content)),
    lengthPrefixed(authorBytes),
    encodeU32LE(parentRefs.length),
    ...parentRefs.map(r => lengthPrefixed(encoder.encode(r))),
    lengthPrefixed(challengeBytes),
    encodeU32LE(protocolVersion),
    encodeLE64(timestamp),
  ]);
}

// ===========================================================================
// CBOR Encoder (minimal, matches cbor-x 1.6.4 output for box types)
// ===========================================================================

/**
 * Key insight: cbor-x preserves JavaScript object insertion order for map
 * keys — it does NOT sort canonically.  We match by encoding keys in the
 * order Object.keys() returns them, which is insertion order.
 */

function cborEncodeString(str) {
  const bytes = encoder.encode(str);
  const len = bytes.length;
  if (len <= 23) return concatUint8Arrays([new Uint8Array([0x60 | len]), bytes]);
  if (len <= 255) return concatUint8Arrays([new Uint8Array([0x78, len]), bytes]);
  throw new Error('String too long for CBOR: ' + len);
}

function cborEncodeBytes(buf) {
  const len = buf.length;
  if (len <= 23) return concatUint8Arrays([new Uint8Array([0x40 | len]), buf]);
  if (len <= 255) return concatUint8Arrays([new Uint8Array([0x58, len]), buf]);
  throw new Error('Bytes too long for CBOR: ' + len);
}

/**
 * Minimal-int form for `number` fields, matching cbor-x 1.6.4 exactly
 * (measured): integers whose argument (n, or -1-n when negative) fits u32
 * use the shortest form — 0–23 inline, then 0x18+u8 / 0x19+u16 / 0x1a+u32,
 * mirrored at 0x20/0x38/0x39/0x3a for negatives; integer arguments beyond
 * u32 encode as float64 (0xfb + IEEE 754 BE, exact for safe integers) —
 * cbor-x never emits 0x1b uint64 for a JS number, only for a bigint.
 * `createdAtBlock` crosses 65536, so the old u16 cap threw exactly where
 * consensus needs the u32 form (audit L-5). Non-integers throw: no valid
 * box carries one, and float64-encoding a fractional height would hide a bug.
 */
function cborEncodeInt(n) {
  if (!Number.isSafeInteger(n)) throw new Error('Non-integer CBOR number: ' + n);
  const major = n >= 0 ? 0x00 : 0x20;
  const val = n >= 0 ? n : -1 - n;
  if (val <= 23) return new Uint8Array([major | val]);
  if (val <= 0xFF) return new Uint8Array([major | 0x18, val]);
  if (val <= 0xFFFF) return new Uint8Array([major | 0x19, (val >>> 8) & 0xFF, val & 0xFF]);
  if (val <= 0xFFFFFFFF) return new Uint8Array([
    major | 0x1A, (val >>> 24) & 0xFF, (val >>> 16) & 0xFF, (val >>> 8) & 0xFF, val & 0xFF,
  ]);
  const out = new Uint8Array(9);
  out[0] = 0xFB;
  new DataView(out.buffer).setFloat64(1, n, false);
  return out;
}

/**
 * Box `value` is a bigint and always encodes as CBOR uint64 — 0x1b + 8 bytes
 * big-endian — even for small values (2n → 1b0000000000000002): cbor-x does
 * not minimize bigints, and the golden vectors freeze that form (Spec B P0).
 * Values are non-negative < 2⁶⁴ by protocol invariant; anything else throws.
 */
function cborEncodeBigInt(v) {
  if (v < 0n || v >= 1n << 64n) throw new Error('bigint out of uint64 range: ' + v);
  const out = new Uint8Array(9);
  out[0] = 0x1B;
  for (let i = 8; i >= 1; i--) { out[i] = Number(v & 0xffn); v >>= 8n; }
  return out;
}

function cborEncodeUndefined() { return new Uint8Array([0xf7]); }

/** Encode a plain object as a CBOR map.  Preserves insertion order. */
function cborEncodeMap(obj) {
  const keys = Object.keys(obj);
  const parts = [];
  for (const k of keys) {
    parts.push(cborEncodeString(k));
    const v = obj[k];
    if (typeof v === 'string')            parts.push(cborEncodeString(v));
    else if (typeof v === 'number')       parts.push(cborEncodeInt(v));
    else if (typeof v === 'bigint')       parts.push(cborEncodeBigInt(v));
    else if (typeof v === 'boolean')      parts.push(new Uint8Array([v ? 0xf5 : 0xf4]));
    else if (v === undefined || v === null) parts.push(cborEncodeUndefined());
    else if (v instanceof Uint8Array)     parts.push(cborEncodeBytes(v));
    else throw new Error('Unsupported CBOR value type for key ' + k);
  }
  const body = concatUint8Arrays(parts);
  const numPairs = keys.length;
  // cbor-x always emits 0xB9 + 2-byte big-endian length for maps
  const header = new Uint8Array([0xB9, (numPairs >> 8) & 0xFF, numPairs & 0xFF]);
  return concatUint8Arrays([header, body]);
}

function cborEncode(value) {
  if (typeof value === 'string')              return cborEncodeString(value);
  if (typeof value === 'number')              return cborEncodeInt(value);
  if (typeof value === 'bigint')              return cborEncodeBigInt(value);
  if (typeof value === 'boolean')             return new Uint8Array([value ? 0xf5 : 0xf4]);
  if (value === undefined || value === null)  return cborEncodeUndefined();
  if (value instanceof Uint8Array)            return cborEncodeBytes(value);
  if (typeof value === 'object')              return cborEncodeMap(value);
  throw new Error('Unsupported CBOR type');
}

// ===========================================================================
// computeTxId (client-side, matches server @dagsocial/types computeTxId)
// ===========================================================================

/**
 * Deterministic transaction ID.
 * Hashes inputs (hex strings), CBOR-encoded outputs (minus `id`),
 * preimages (sorted by boxId), and protocolVersion.
 */
function computeTxId(tx) {
  const parts = [];

  // 1. Inputs — hash hex strings as UTF-8 text
  for (const input of tx.inputs) {
    parts.push(encoder.encode(input));
  }

  // 2. Outputs — CBOR encode each box, stripping `id` before encoding
  for (const output of tx.outputs) {
    const { id, ...rest } = output;
    // Convert hex-string binary fields to Uint8Array for CBOR encoding
    const binaryFields = ['owner', 'likerId', 'secretHash', 'inviterId', 'inviteePublicKey'];
    const boxForCbor = {};
    for (const [k, v] of Object.entries(rest)) {
      if (binaryFields.includes(k) && typeof v === 'string') {
        boxForCbor[k] = hex2buf(v);
      } else {
        boxForCbor[k] = v;
      }
    }
    parts.push(cborEncode(boxForCbor));
  }

  // 3. Preimages (sorted by boxId key, if present)
  if (tx.preimages) {
    const sortedKeys = Object.keys(tx.preimages).sort();
    for (const boxId of sortedKeys) {
      parts.push(encoder.encode(boxId));
      const preimage = tx.preimages[boxId];
      parts.push(typeof preimage === 'string' ? hex2buf(preimage) : preimage);
    }
  }

  // 4. Protocol version as UTF-8 string
  parts.push(encoder.encode(String(tx.protocolVersion)));

  // 5. Blake2b-512 → first 32 bytes → hex
  const combined = concatUint8Arrays(parts);
  const hash = blake2b(combined, null, 64).slice(0, 32);
  return buf2hex(hash);
}

// ===========================================================================
// PoW
// ===========================================================================

function countLeadingZeroBits(buf) {
  let bits = 0;
  for (let i = 0; i < buf.length; i++) {
    if (buf[i] === 0) { bits += 8; continue; }
    let mask = 0x80;
    while ((buf[i] & mask) === 0) { bits++; mask >>= 1; }
    break;
  }
  return bits;
}

/** PoW preimage = postFieldBytes; solvePoW appends u64LE(nonce). */
function buildPowInput(content, authorBytes, parentRefs, challengeBytes, protocolVersion, timestamp) {
  return postFieldBytes(content, authorBytes, parentRefs, challengeBytes, protocolVersion, timestamp);
}

function solvePoW(powInput, targetBits, onProgress) {
  let nonce = 0;
  const start = performance.now();
  while (true) {
    const nonceBytes = encodeLE64(nonce);
    const combined = concatUint8Arrays([powInput, nonceBytes]);
    const hash = blake2b(combined, null, 64).slice(0, 32);
    if (countLeadingZeroBits(hash) >= targetBits) return nonce;

    nonce++;
    if (nonce % 200000 === 0) {
      const elapsed = ((performance.now() - start) / 1000).toFixed(1);
      if (onProgress) onProgress(`${(nonce / 1e6).toFixed(1)}M hashes (${elapsed}s)...`);
    }
  }
}

// ===========================================================================
// Signing — txId-based (Ed25519 over computeTxId)
// ===========================================================================

/** Sign a txId hash with the current identity's Ed25519 private key. */
async function signTxId(tx) {
  const txId = computeTxId(tx);
  const txIdBytes = hex2buf(txId);
  const sig = await crypto.subtle.sign('Ed25519', privKey, txIdBytes);
  return { txId, signature: buf2hex(new Uint8Array(sig)) };
}

/** Sign a post (same input as PoW, excludes powNonce). Preserved for post signing. */
function buildSignHashInput(content, authorBytes, parentRefs, challengeBytes, protocolVersion, timestamp) {
  return buildPowInput(content, authorBytes, parentRefs, challengeBytes, protocolVersion, timestamp);
}

async function signPost(content, authorBytes, parentRefs, challengeBytes, protocolVersion, timestamp) {
  const input = buildSignHashInput(content, authorBytes, parentRefs, challengeBytes, protocolVersion, timestamp);
  const hash = blake2b(input, null, 64).slice(0, 32);
  const sig = await crypto.subtle.sign('Ed25519', privKey, hash);
  return buf2hex(new Uint8Array(sig));
}

// ===========================================================================
// UTXO state fetching
// ===========================================================================

/**
 * Fetch all karma boxes for the active identity.
 * Returns { total, boxes: [{ boxId, value }] } with total/value as bigint
 * (the API serializes them as decimal strings — JSON cannot carry a bigint).
 */
async function fetchKarmaBox() {
  if (!userId) return null;
  try {
    const res = await fetch(API + '/karma/' + encodeURIComponent(userId));
    if (!res.ok) return null;
    const data = await res.json(); // { userId, total, boxes: [{ boxId, value }] }
    data.total = BigInt(data.total);
    for (const b of data.boxes) b.value = BigInt(b.value);
    return data;
  } catch {
    return null;
  }
}

/**
 * Largest-first UTXO selection. Returns boxes whose combined value covers
 * requiredAmount. Assumes boxes are sorted value descending (server does this).
 * Throws if total is insufficient.
 */
function selectBoxes(boxes, requiredAmount) {
  if (requiredAmount <= 0n) return [];
  let accumulated = 0n;
  const selected = [];
  for (const box of boxes) {
    accumulated += box.value;
    selected.push(box);
    if (accumulated >= requiredAmount) break;
  }
  if (accumulated < requiredAmount) {
    throw new Error(`Insufficient total value: need ${requiredAmount}, have ${accumulated}`);
  }
  return selected;
}

async function fetchCreditBoxes() {
  if (!userId) return null;
  try {
    const res = await fetch(API + '/credits/' + encodeURIComponent(userId));
    if (!res.ok) return null;
    const data = await res.json(); // { userId, total, boxes: [{ boxId, value, lockedUntilBlock? }] }
    data.total = BigInt(data.total);
    for (const b of data.boxes) b.value = BigInt(b.value);
    return data;
  } catch {
    return null;
  }
}

/** Fetch pending invite and bond boxes for the active identity. */
async function fetchInviteState() {
  if (!userId) return { pending: [], bonds: [] };
  try {
    const res = await fetch(API + '/invites/' + encodeURIComponent(userId));
    if (!res.ok) return { pending: [], bonds: [] };
    const data = await res.json(); // { pending: InviteBox[], bonds: BondBox[] }
    for (const b of data.pending) b.value = BigInt(b.value);
    for (const b of data.bonds) b.value = BigInt(b.value);
    return data;
  } catch {
    return { pending: [], bonds: [] };
  }
}

// ===========================================================================
// Tx construction helpers
// ===========================================================================

/** Build the karma-lock tx for post creation. Uses all boxes needed to cover lockAmount. */
function buildKarmaLockTx(karmaBox, lockAmount, targetPostId, pubKeyHex) {
  const now = currentBlockHeight;
  const selected = selectBoxes(karmaBox.boxes, lockAmount);
  const selectedTotal = selected.reduce((sum, b) => sum + b.value, 0n);
  const newKarmaValue = selectedTotal - lockAmount;

  const karmaOutput = {
    boxType: 'karma',
    value: newKarmaValue,
    createdAtBlock: now,
    owner: pubKeyHex,
    guard: 'owner_signature',
    proofSource: targetPostId,
    lastTouchBlock: now,
  };

  const postLockOutput = {
    boxType: 'post_lock',
    value: lockAmount,
    createdAtBlock: now,
    originalValue: lockAmount,
    owner: pubKeyHex,
    targetPostId,
    guard: 'epoch_tally',
  };

  return {
    inputs: selected.map(b => b.boxId),
    outputs: [karmaOutput, postLockOutput],
    signatures: {},
    protocolVersion: PROTOCOL_VERSION,
  };
}

/** Build a like tx: consumes karma boxes, produces karma (total - 2) + LikeBox. */
function buildLikeTx(karmaBox, targetPostId, pubKeyHex) {
  const now = currentBlockHeight;
  const selected = selectBoxes(karmaBox.boxes, LIKE_COST);
  const selectedTotal = selected.reduce((sum, b) => sum + b.value, 0n);
  const newKarmaValue = selectedTotal - LIKE_COST;

  const karmaOutput = {
    boxType: 'karma',
    value: newKarmaValue,
    createdAtBlock: now,
    owner: pubKeyHex,
    guard: 'owner_signature',
    proofSource: targetPostId,
    lastTouchBlock: now,
  };

  const likeOutput = {
    boxType: 'like',
    value: LIKE_COST,
    createdAtBlock: now,
    likerId: pubKeyHex,
    targetPostId,
    guard: 'epoch_tally',
  };

  return {
    inputs: selected.map(b => b.boxId),
    outputs: [karmaOutput, likeOutput],
    signatures: {},
    protocolVersion: PROTOCOL_VERSION,
  };
}

/**
 * Build an unlike tx: consumes a LikeBox, returns the locked karma in full.
 *
 * The node enforces sum(inputs) == sum(outputs), so the refund must equal the
 * LikeBox value. (This used to burn 1 karma as a "penalty" — audit L-6 — which
 * both contradicted "locked karma is never burned" and is now rejected.)
 */
function buildUnlikeTx(likeBoxId, pubKeyHex) {
  const now = currentBlockHeight;
  const refundValue = LIKE_COST;

  const karmaOutput = {
    boxType: 'karma',
    value: refundValue,
    createdAtBlock: now,
    owner: pubKeyHex,
    guard: 'owner_signature',
    proofSource: 'unlike',
    lastTouchBlock: now,
  };

  return {
    inputs: [likeBoxId],
    outputs: [karmaOutput],
    signatures: {},
    protocolVersion: PROTOCOL_VERSION,
  };
}

/** Build an invite-create tx: karma boxes → karma + invite + bond. */
function buildCreateInviteTx(karmaBox, pubKeyHex, secretHashHex) {
  const now = currentBlockHeight;
  const totalDeducted = INVITE_KARMA_AMOUNT + INVITE_BOND_KARMA;
  const selected = selectBoxes(karmaBox.boxes, totalDeducted);
  const selectedTotal = selected.reduce((sum, b) => sum + b.value, 0n);
  const newKarmaValue = selectedTotal - totalDeducted;

  const karmaOutput = {
    boxType: 'karma',
    value: newKarmaValue,
    createdAtBlock: now,
    owner: pubKeyHex,
    guard: 'owner_signature',
    proofSource: 'invite-create',
    lastTouchBlock: now,
  };

  const inviteOutput = {
    boxType: 'invite',
    value: INVITE_KARMA_AMOUNT,
    createdAtBlock: now,
    secretHash: secretHashHex,
    inviterId: pubKeyHex,
    guard: 'hash_preimage_with_bond',
  };

  const inviteBoxId = computeBoxId(inviteOutput);
  inviteOutput.id = inviteBoxId;

  const bondOutput = {
    boxType: 'bond',
    value: INVITE_BOND_KARMA,
    createdAtBlock: now,
    inviterId: pubKeyHex,
    inviteBoxId: inviteBoxId,
    inviteePublicKey: '00'.repeat(32), // 32 zero bytes = unclaimed
    probationStartBlock: 0,
    probationEndBlock: 0,
    guard: 'bond_dual',
  };

  return {
    inputs: selected.map(b => b.boxId),
    outputs: [karmaOutput, inviteOutput, bondOutput],
    signatures: {},
    protocolVersion: PROTOCOL_VERSION,
  };
}

/**
 * Build an invite-claim tx: invite + bond → karma(invitee) + bond(claimed).
 * @param {Object} inviteBox - { id, value, inviterId, secretHash }
 * @param {Object} bondBox - { id, value }
 * @param {string} inviteePubKeyHex
 * @param {string} secretHex - raw hex preimage for hash_preimage guard
 */
function buildClaimInviteTx(inviteBox, bondBox, inviteePubKeyHex, secretHex) {
  const now = currentBlockHeight;

  const karmaOutput = {
    boxType: 'karma',
    value: inviteBox.value,
    createdAtBlock: now,
    owner: inviteePubKeyHex,
    guard: 'owner_signature',
    proofSource: inviteBox.id,
    lastTouchBlock: now,
  };

  const bondOutput = {
    boxType: 'bond',
    value: bondBox.value,
    createdAtBlock: now,
    inviterId: inviteBox.inviterId,
    inviteBoxId: bondBox.inviteBoxId || '',
    inviteePublicKey: inviteePubKeyHex,
    probationStartBlock: bondBox.probationStartBlock,
    probationEndBlock: bondBox.probationEndBlock,
    guard: 'bond_dual',
  };

  return {
    inputs: [inviteBox.id, bondBox.id],
    outputs: [karmaOutput, bondOutput],
    signatures: {},
    preimages: { [inviteBox.id]: secretHex },
    protocolVersion: PROTOCOL_VERSION,
  };
}

/**
 * Build a commit tx: BondBox(unclaimed) → BondBox(committed).
 * Called as step 1 of the two-step redeem. The preimage proves knowledge
 * of the secret without publishing it on-chain yet.
 * @param {Object} bondBox - { id, value, inviterId, inviteBoxId }
 * @param {string} inviteePubKeyHex
 * @param {string} secretHex - raw hex preimage for bond_dual's hash_preimage path
 */
function buildCommitTx(bondBox, inviteePubKeyHex, secretHex) {
  const now = currentBlockHeight;

  const bondOutput = {
    boxType: 'bond',
    value: bondBox.value,
    createdAtBlock: now,
    inviterId: bondBox.inviterId,
    inviteBoxId: bondBox.inviteBoxId,
    inviteePublicKey: inviteePubKeyHex,
    probationStartBlock: now,
    probationEndBlock: now + INVITE_PROBATION_BLOCKS,
    guard: 'bond_dual',
  };

  return {
    inputs: [bondBox.id],
    outputs: [bondOutput],
    signatures: {},
    preimages: { [bondBox.id]: secretHex },
    protocolVersion: PROTOCOL_VERSION,
  };
}

/**
 * Build an invite-cancel tx: karma + invite + bond → karma (refund to inviter).
 * @param {Object} karmaBox - { total, boxes }
 * @param {Object} inviteBox - { id, value }
 * @param {Object} bondBox - { id, value }
 * @param {string} pubKeyHex - inviter's public key
 */
function buildCancelInviteTx(karmaBox, inviteBox, bondBox, pubKeyHex) {
  const now = currentBlockHeight;
  // Refund: consolidate all karma boxes + invite value + bond value
  const allKarmaBoxIds = karmaBox.boxes.map(b => b.boxId);
  const totalRefund = karmaBox.total + inviteBox.value + bondBox.value;

  const karmaOutput = {
    boxType: 'karma',
    value: totalRefund,
    createdAtBlock: now,
    owner: pubKeyHex,
    guard: 'owner_signature',
    proofSource: 'invite-cancel',
    lastTouchBlock: now,
  };

  return {
    inputs: [...allKarmaBoxIds, inviteBox.id, bondBox.id],
    outputs: [karmaOutput],
    signatures: {},
    protocolVersion: PROTOCOL_VERSION,
  };
}

// ===========================================================================
// computeBoxId (client-side, matches server computeBoxId)
// ===========================================================================

function computeBoxId(box) {
  const { id, ...rest } = box;
  const binaryFields = ['owner', 'likerId', 'secretHash', 'inviterId', 'inviteePublicKey'];
  const boxForCbor = {};
  for (const [k, v] of Object.entries(rest)) {
    if (binaryFields.includes(k) && typeof v === 'string') {
      boxForCbor[k] = hex2buf(v);
    } else {
      boxForCbor[k] = v;
    }
  }
  const cborBytes = cborEncode(boxForCbor);
  const hash = blake2b(cborBytes, null, 64).slice(0, 32);
  return buf2hex(hash);
}

// ===========================================================================
// Post ID computation (client-side, matches server computePostId)
// ===========================================================================

/**
 * postId = blake2b512(POST_ID_DOMAIN ‖ postFieldBytes ‖ u64LE(powNonce))[0..32]
 *
 * Domain-tagged, so the id is never equal to the PoW hash over the same post.
 */
function computePostId(post) {
  const cBytes = typeof post.challenge === 'string' ? hex2buf(post.challenge) : post.challenge;
  const aBytes = typeof post.author === 'string' ? hex2buf(post.author) : post.author;
  const combined = concatUint8Arrays([
    POST_ID_DOMAIN,
    postFieldBytes(post.content, aBytes, post.parentRefs, cBytes, post.protocolVersion, post.timestamp),
    encodeLE64(post.powNonce),
  ]);
  const hash = blake2b(combined, null, 64).slice(0, 32);
  return buf2hex(hash);
}

function setStatus(text, cls) {
  const s = document.getElementById('postStatus');
  s.textContent = text; s.className = 'status status-' + (cls || 'busy');
}

function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escWithBreaks(s) { return esc(s).replace(/\n/g, '<br>'); }

// ===========================================================================
// Identity management
// ===========================================================================

function refreshIdentityDropdown() {
  const sel = document.getElementById('identitySelect');
  sel.innerHTML = identities.map((ident, i) => {
    const shortPub = ident.pubKeyHex.slice(0, 12) + '...';
    return `<option value="${i}">Identity ${i + 1} (${shortPub})</option>`;
  }).join('');
  if (activeIndex >= 0 && activeIndex < identities.length) {
    sel.value = activeIndex;
  }
}

async function activateIdentity(index) {
  if (index < 0 || index >= identities.length) return;

  activeIndex = index;
  const ident = identities[index];
  pubKeyRaw = hex2buf(ident.pubKeyHex);

  // Decode PKCS8 private key from base64
  const privBytes = Uint8Array.from(atob(ident.privKeyBase64), c => c.charCodeAt(0));
  privKey = await crypto.subtle.importKey('pkcs8', privBytes, 'Ed25519', true, ['sign']);

  // userId IS the hex-encoded public key
  userId = ident.pubKeyHex;

  // Update UI
  document.getElementById('identitySelect').value = index;
  document.getElementById('currentUserId').textContent = userId;
  document.getElementById('postBtn').disabled = false;

  // Clear per-session tracking for this identity
  pendingLikes.clear();
  likeBoxes.clear();

  // Load per-identity balances
  loadIdentityStatus();

  // Reload feed
  loadFeed();
}

async function createIdentity() {
  // Generate keypair
  const key = await crypto.subtle.generateKey('Ed25519', true, ['sign', 'verify']);
  const pubKeyHex = buf2hex(new Uint8Array(await crypto.subtle.exportKey('raw', key.publicKey)));
  const privBytes = new Uint8Array(await crypto.subtle.exportKey('pkcs8', key.privateKey));
  const privKeyBase64 = btoa(String.fromCharCode(...privBytes));

  // Save to localStorage
  identities.push({ pubKeyHex, privKeyBase64 });
  localStorage.setItem(STORAGE_KEY, JSON.stringify(identities));

  // Refresh dropdown and switch to new identity
  refreshIdentityDropdown();
  await activateIdentity(identities.length - 1);
}

function exportIdentity() {
  if (activeIndex < 0 || activeIndex >= identities.length) return;
  const ident = identities[activeIndex];
  const json = JSON.stringify({ pubKeyHex: ident.pubKeyHex, privKeyBase64: ident.privKeyBase64 });
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'dagsocial-identity.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function importIdentityFile(file) {
  const reader = new FileReader();
  reader.onload = async () => {
    try {
      const data = JSON.parse(reader.result);
      if (!data.pubKeyHex || !data.privKeyBase64) {
        alert('Invalid identity file: missing pubKeyHex or privKeyBase64');
        return;
      }
      if (!/^[0-9a-f]{64}$/i.test(data.pubKeyHex)) {
        alert('Invalid identity file: pubKeyHex must be 64 hex chars');
        return;
      }

      // Check for duplicates
      if (identities.some(i => i.pubKeyHex === data.pubKeyHex)) {
        alert('This identity is already in your list');
        return;
      }

      // Save to localStorage
      identities.push({ pubKeyHex: data.pubKeyHex, privKeyBase64: data.privKeyBase64 });
      localStorage.setItem(STORAGE_KEY, JSON.stringify(identities));

      // Refresh dropdown
      refreshIdentityDropdown();
    } catch (e) {
      alert('Failed to parse identity file: ' + e.message);
    }
  };
  reader.readAsText(file);
}

async function loadIdentities() {
  // Read from localStorage
  const stored = localStorage.getItem(STORAGE_KEY);
  if (stored) {
    try {
      identities = JSON.parse(stored);
      if (!Array.isArray(identities)) identities = [];
    } catch {
      identities = [];
    }
  }

  // If empty, auto-generate one
  if (identities.length === 0) {
    const key = await crypto.subtle.generateKey('Ed25519', true, ['sign', 'verify']);
    const pubKeyHex = buf2hex(new Uint8Array(await crypto.subtle.exportKey('raw', key.publicKey)));
    const privBytes = new Uint8Array(await crypto.subtle.exportKey('pkcs8', key.privateKey));
    const privKeyBase64 = btoa(String.fromCharCode(...privBytes));
    identities = [{ pubKeyHex, privKeyBase64 }];
    localStorage.setItem(STORAGE_KEY, JSON.stringify(identities));
  }

  // Populate dropdown
  refreshIdentityDropdown();

  // Activate first identity
  await activateIdentity(0);
}

// ===========================================================================
// Post flow (with karma-lock tx)
// ===========================================================================

document.getElementById('postBtn').addEventListener('click', async () => {
  const btn = document.getElementById('postBtn');
  const content = document.getElementById('content').value.trim();
  if (!content) return;

  btn.disabled = true;
  try {
    // 1. Fetch current karma box
    const karmaBox = await fetchKarmaBox();
    if (!karmaBox) {
      setStatus('No karma box found — use faucet first', 'error');
      return;
    }

    // 2. Request challenge
    setStatus('requesting challenge...', 'busy');
    const chalRes = await fetch(API + '/challenge', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ userId }),
    });
    if (!chalRes.ok) {
      const err = await chalRes.json();
      setStatus(err.error || 'challenge failed', 'error');
      return;
    }
    const { challenge: challengeHex, targetBits } = await chalRes.json();
    const challengeBytes = hex2buf(challengeHex);

    // 3. Build powInput and solve PoW
    setStatus(`solving PoW (${targetBits} bits)...`, 'busy');
    const parentRefs = document.getElementById('parents').value
      .split(',').map(s => s.trim()).filter(Boolean);
    const timestamp = Date.now();
    const powInput = buildPowInput(content, pubKeyRaw, parentRefs, challengeBytes, PROTOCOL_VERSION, timestamp);

    const powNonce = solvePoW(powInput, targetBits, (msg) => {
      setStatus(msg, 'busy');
    });

    // 4. Sign the post
    setStatus('signing post...', 'busy');
    const signature = await signPost(content, pubKeyRaw, parentRefs, challengeBytes, PROTOCOL_VERSION, timestamp);

    // 5. Determine lock amount
    const lockAmount = parentRefs.length === 0 ? POST_LOCK_THREAD_COST : POST_LOCK_REPLY_COST;
    if (karmaBox.total < lockAmount) {
      setStatus(`Insufficient karma: need ${lockAmount}, have ${karmaBox.total}`, 'error');
      return;
    }

    // 6. Build post (for postId computation)
    const post = {
      content,
      author: userId,
      parentRefs,
      challenge: challengeHex,
      powNonce,
      protocolVersion: PROTOCOL_VERSION,
      timestamp,
      signature,
    };
    const postId = computePostId(post);

    // 7. Build and sign karma-lock tx
    setStatus('building karma-lock tx...', 'busy');
    const pubKeyHex = buf2hex(pubKeyRaw);
    const karmaLockTx = buildKarmaLockTx(karmaBox, lockAmount, postId, pubKeyHex);
    const clientTxId = computeTxId(karmaLockTx);
    console.log('[client] txId:', clientTxId);
    const { signature: txSig } = await signTxId(karmaLockTx);
    karmaLockTx.signatures[pubKeyHex] = txSig;

    // 8. Submit post + karma-lock tx
    setStatus('posting...', 'busy');
    const postRes = await fetch(API + '/posts', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        content,
        author: userId,
        parentRefs,
        challenge: challengeHex,
        powNonce,
        protocolVersion: PROTOCOL_VERSION,
        timestamp,
        signature,
        karmaLockTx,
      }, jsonBigint),
    });
    if (!postRes.ok) {
      const err = await postRes.json();
      setStatus(err.error || 'post failed', 'error');
      return;
    }
    const posted = await postRes.json();
    setStatus('posted! ' + posted.postId.slice(0, 12) + '...', 'ok');
    document.getElementById('content').value = '';
    document.getElementById('parents').value = '';
    loadFeed();
    loadIdentityStatus();
  } catch (e) {
    setStatus('error: ' + e.message, 'error');
  } finally {
    btn.disabled = false;
  }
});

// ===========================================================================
// Like / Unlike flow (tx-based)
// ===========================================================================

async function doLike(targetPostId) {
  try {
    const karmaBox = await fetchKarmaBox();
    if (!karmaBox) {
      setStatus('No karma box — cannot like', 'error');
      return false;
    }
    if (karmaBox.total < LIKE_COST) {
      setStatus(`Insufficient karma to like: need ${LIKE_COST}, have ${karmaBox.total}`, 'error');
      return false;
    }

    const pubKeyHex = buf2hex(pubKeyRaw);
    const tx = buildLikeTx(karmaBox, targetPostId, pubKeyHex);
    const { signature } = await signTxId(tx);
    tx.signatures[pubKeyHex] = signature;

    const res = await fetch(API + '/likes', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ tx }, jsonBigint),
    });
    const data = await res.json();
    if (!res.ok) {
      setStatus(data.reason || data.error || 'like failed', 'error');
      return false;
    }

    // Compute and store the LikeBox ID for later unlike
    if (data.status === 'pending') {
      const likeBoxId = computeBoxId(tx.outputs[1]); // second output is the LikeBox
      likeBoxes.set(targetPostId, { likeBoxId, isFree: false });
    } else if (data.status === 'free') {
      likeBoxes.set(targetPostId, { likeBoxId: null, isFree: true, likeId: data.likeId });
    }

    return true;
  } catch (e) {
    setStatus('like error: ' + e.message, 'error');
    return false;
  }
}

async function doUnlike(targetPostId) {
  const stored = likeBoxes.get(targetPostId);
  if (!stored) {
    setStatus('No like record found for this post', 'error');
    return false;
  }

  try {
    const pubKeyHex = buf2hex(pubKeyRaw);

    if (stored.isFree) {
      // Free like — no LikeBox to consume, and a free like costs nothing, so
      // the tx just re-anchors one karma box to carry the removal.
      // It re-emits that box's own value: the old version paid out the
      // *aggregate* balance minus a 1-karma "penalty" (audit L-6, L-7), which
      // both minted karma when the account held more than one box and is now
      // rejected by the conservation check.
      const karmaBox = await fetchKarmaBox();
      const sourceBox = karmaBox && karmaBox.boxes && karmaBox.boxes[0];
      if (!sourceBox) {
        setStatus('No karma box to anchor the unlike', 'error');
        return false;
      }
      const now = currentBlockHeight;
      const tx = {
        inputs: [sourceBox.boxId],
        outputs: [{
          boxType: 'karma',
          value: sourceBox.value,
          createdAtBlock: now,
          owner: pubKeyHex,
          guard: 'owner_signature',
          proofSource: 'unlike-free',
          lastTouchBlock: now,
        }],
        signatures: {},
        protocolVersion: PROTOCOL_VERSION,
      };
      const { signature } = await signTxId(tx);
      tx.signatures[pubKeyHex] = signature;

      const res = await fetch(API + '/likes/remove', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ tx }, jsonBigint),
      });
      const data = await res.json();
      if (!res.ok) {
        setStatus(data.reason || data.error || 'unlike failed', 'error');
        return false;
      }
      return true;
    } else {
      // Locked like — consume the LikeBox
      if (!stored.likeBoxId) {
        setStatus('No LikeBox ID stored for unlike', 'error');
        return false;
      }
      const tx = buildUnlikeTx(stored.likeBoxId, pubKeyHex);
      const { signature } = await signTxId(tx);
      tx.signatures[pubKeyHex] = signature;

      const res = await fetch(API + '/likes/remove', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ tx }, jsonBigint),
      });
      const data = await res.json();
      if (!res.ok) {
        setStatus(data.reason || data.error || 'unlike failed', 'error');
        return false;
      }
      return true;
    }
  } catch (e) {
    setStatus('unlike error: ' + e.message, 'error');
    return false;
  }
}

// Feed
// ===========================================================================

/**
 * Format a Unix-ms timestamp as a relative time string ("2m ago", "3h ago").
 * Returns absolute date/time as the title attribute for hover.
 */
function formatRelativeTime(ts) {
  const now = Date.now();
  const diff = now - ts;
  const seconds = Math.floor(diff / 1000);
  const minutes = Math.floor(seconds / 60);
  const hours = Math.floor(minutes / 60);
  const days = Math.floor(hours / 24);

  let relative;
  if (seconds < 60) relative = 'just now';
  else if (minutes < 60) relative = `${minutes}m ago`;
  else if (hours < 24) relative = `${hours}h ago`;
  else if (days < 7) relative = `${days}d ago`;
  else relative = new Date(ts).toLocaleDateString();

  const absolute = new Date(ts).toLocaleString();
  return { relative, absolute };
}

function renderPost(p, id, depth, highlighted = false) {
  const shortId = id.slice(0, 16);
  const liked = userId && p.likers && p.likers.includes(userId);
  const likeCount = typeof p.likeCount === 'number' ? p.likeCount : 0;
  const indent = depth * 20;
  const isOwn = userId && p.author === userId;
  const deleteBtn = isOwn
    ? `<button class="like-btn delete-btn" data-post-id="${id}" style="color:var(--red)">&#10005; Delete</button>`
    : '';
  const { relative, absolute } = formatRelativeTime(p.timestamp);
  const hlClass = highlighted ? ' post-highlighted' : '';
  return `
    <div class="post${hlClass}" data-post-id="${id}" style="margin-left:${indent}px;border-left:${depth > 0 ? '2px solid var(--p-dk)' : 'none'};padding-left:${depth > 0 ? '10px' : '12px'}">
      <div class="post-author" style="cursor:pointer" onclick="event.stopPropagation();viewProfile('${esc(p.author)}')" title="View posts by this author">${esc(p.author.slice(0, 12))}...</div>
      <div class="post-content">${escWithBreaks(p.content)}</div>
      <div class="post-meta">
        <a class="permalink" onclick="event.stopPropagation();loadThread('${esc(id)}')" title="${esc(absolute)}">${esc(relative)}</a>
        <span>${p.parentRefs.length ? p.parentRefs.length + ' parent(s)' : 'genesis'}</span>
        <span style="font-family:monospace;font-size:10px">${esc(shortId)}...</span>
        <button class="like-btn reply-btn" data-post-id="${id}">&#8617; Reply</button>
        <button class="like-btn${liked ? ' liked' : ''}" data-post-id="${id}" data-liked="${liked ? '1' : '0'}"${pendingLikes.has(id) ? ' disabled' : ''}>
          ${pendingLikes.has(id)
            ? '<span class="spinner"></span>Pending...'
            : (liked ? '&#10084;&#65039; Liked' : '&#10084;&#65039; Like') + ` (${likeCount})`}
        </button>
        ${deleteBtn}
      </div>
    </div>
  `;
}

function renderThread(roots, postMap, children, depth) {
  const sorted = [...roots].sort((a, b) => b.timestamp - a.timestamp);
  return sorted.map(p => {
    const id = computePostId(p);
    const childPosts = (children.get(id) || []).sort((a, b) => a.timestamp - b.timestamp);
    return renderPost(p, id, depth) + renderThread(childPosts, postMap, children, depth + 1);
  }).join('');
}

async function loadFeed() {
  const feed = document.getElementById('feed');
  try {
    let url = API + '/posts?limit=50';
    if (feedFilter !== 'all') url += '&author=' + feedFilter;
    const res = await fetch(url);
    const posts = await res.json();
    if (!posts.length) { feed.innerHTML = '<div class="empty">No posts yet. Write something!</div>'; return; }

    // Build post map and children index
    const postMap = new Map();
    const children = new Map();
    for (const p of posts) {
      const id = computePostId(p);
      postMap.set(id, p);
    }
    for (const p of posts) {
      const id = computePostId(p);
      for (const parentId of p.parentRefs) {
        if (postMap.has(parentId)) {
          if (!children.has(parentId)) children.set(parentId, []);
          children.get(parentId).push(p);
        }
      }
    }

    // Roots: posts whose parentRefs are empty or none are in the fetched set
    const rootPosts = posts.filter(p => {
      if (!p.parentRefs.length) return true;
      return !p.parentRefs.some(pid => postMap.has(pid));
    });

    feed.innerHTML = renderThread(rootPosts, postMap, children, 0) ||
      '<div class="empty">No root posts found. Try posting something!</div>';

    // Attach reply/like/delete handlers
    attachFeedHandlers(feed);
  } catch (e) {
    feed.innerHTML = '<div class="empty">Failed to load feed</div>';
  }
}

// ===========================================================================
// Thread view (permalink)
// ===========================================================================

/** Currently viewed thread post ID, or null if showing the normal feed. */
let threadPostId = null;

/**
 * Fetch and render a single post with its full thread context.
 * Pushes state to browser history for permalink sharing and back-button support.
 */
async function loadThread(postId, pushState = true) {
  threadPostId = postId;
  const feed = document.getElementById('feed');

  if (pushState) {
    const url = new URL(window.location.href);
    url.searchParams.set('post', postId);
    window.history.pushState({ postId }, '', url.toString());
  }

  try {
    const res = await fetch(API + '/posts/' + encodeURIComponent(postId) + '/thread');
    if (!res.ok) {
      feed.innerHTML = '<div class="empty">Post not found.</div>';
      return;
    }
    const thread = await res.json();

    // Build ancestors HTML (straight line, oldest first → immediate parent)
    let ancestorsHtml = '';
    if (thread.ancestors && thread.ancestors.length > 0) {
      const parts = [];
      for (const a of thread.ancestors) {
        const aid = computePostId(a);
        parts.push(renderPost(a, aid, 0, false));
        parts.push('<div class="ancestor-connector">↓</div>');
      }
      ancestorsHtml = parts.join('');
    }

    // Target post (highlighted)
    const targetHtml = renderPost(thread.post, postId, 0, true);

    // Build descendants threaded view
    let descendantsHtml = '';
    if (thread.descendants && thread.descendants.length > 0) {
      const allDesc = [...thread.descendants];
      // Include target in the map so children refs to target resolve
      const allPosts = [...allDesc, thread.post];

      const postMap = new Map();
      const children = new Map();
      for (const p of allPosts) {
        const pid = computePostId(p);
        postMap.set(pid, p);
      }
      for (const p of allDesc) {
        const pid = computePostId(p);
        for (const parentId of p.parentRefs) {
          if (postMap.has(parentId)) {
            if (!children.has(parentId)) children.set(parentId, []);
            children.get(parentId).push(p);
          }
        }
      }

      // Roots of the descendant tree: posts whose parents are all outside the
      // descendant set (i.e., their only parent in our map is the target post)
      const rootDesc = allDesc.filter(p => {
        if (!p.parentRefs.length) return false;
        return p.parentRefs.every(pid => !postMap.has(pid) || pid === postId);
      });

      if (rootDesc.length > 0) {
        descendantsHtml = renderThread(rootDesc, postMap, children, 1);
      }
    }

    const previewUrl = `${API}/preview/${encodeURIComponent(postId)}`;

    feed.innerHTML = `
      <div class="thread-header">
        <button id="threadBackBtn" class="small">← Back to feed</button>
        <button id="copyLinkBtn" class="small" style="background:var(--p-dk)">Copy link</button>
        <span id="copyLinkMsg" style="font-size:11px;color:var(--p);display:none">Copied!</span>
      </div>
      ${ancestorsHtml}
      ${targetHtml}
      ${descendantsHtml ? '<div style="margin-top:8px"></div>' + descendantsHtml : ''}
    `;

    // Back button handler
    document.getElementById('threadBackBtn').addEventListener('click', () => {
      window.history.back();
    });

    // Copy link handler
    document.getElementById('copyLinkBtn').addEventListener('click', async () => {
      try {
        const fullUrl = new URL(previewUrl, window.location.href).toString();
        await navigator.clipboard.writeText(fullUrl);
        const msg = document.getElementById('copyLinkMsg');
        msg.style.display = '';
        setTimeout(() => { msg.style.display = 'none'; }, 2000);
      } catch {
        // Fallback for older browsers
        const input = document.createElement('input');
        input.value = new URL(previewUrl, window.location.href).toString();
        document.body.appendChild(input);
        input.select();
        document.execCommand('copy');
        document.body.removeChild(input);
      }
    });

    // Attach reply/like/delete handlers (same pattern as loadFeed)
    attachFeedHandlers(feed);
  } catch (e) {
    feed.innerHTML = '<div class="empty">Failed to load thread</div>';
  }
}

// Expose for inline onclick handlers (module scripts don't create globals)
window.loadThread = loadThread;

/** Clear thread view and return to normal feed. Called on popstate back to feed. */
function clearThread() {
  threadPostId = null;
  loadFeed();
}

// ===========================================================================
// Feed event handler attachment (shared between feed and thread views)
// ===========================================================================

function attachFeedHandlers(container) {
  container.querySelectorAll('.reply-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const postId = btn.dataset.postId;
      if (!postId) return;
      const input = document.getElementById('parents');
      const current = input.value.trim();
      input.value = current ? current + ', ' + postId : postId;
      input.scrollIntoView({ behavior: 'smooth' });
      input.focus();
    });
  });

  container.querySelectorAll('.like-btn:not(.reply-btn):not(.delete-btn)').forEach(btn => {
    btn.addEventListener('click', async () => {
      const postId = btn.dataset.postId;
      const isLiked = btn.dataset.liked === '1';
      if (!postId) return;

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Pending...';
      pendingLikes.add(postId);

      if (isLiked) {
        const ok = await doUnlike(postId);
        if (ok) {
          likeBoxes.delete(postId);
          loadIdentityStatus();
        }
      } else {
        const ok = await doLike(postId);
        if (ok) {
          loadIdentityStatus();
        }
      }

      pendingLikes.delete(postId);
      btn.disabled = false;
      // Refresh the current view
      if (threadPostId) loadThread(threadPostId, false);
      else loadFeed();
    });
  });

  container.querySelectorAll('.delete-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const postId = btn.dataset.postId;
      if (!postId || !userId || !privKey) return;

      if (!confirm('Delete this post and all replies? This will return any locked karma to each reply author.')) {
        return;
      }

      btn.disabled = true;
      btn.textContent = '...';

      try {
        const chalRes = await fetch(API + '/challenge', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId }),
        });
        if (!chalRes.ok) {
          throw new Error('Failed to get challenge');
        }
        const { challenge } = await chalRes.json();

        const chalBytes = hex2buf(challenge);
        const hash = blake2b(chalBytes, null, 64).slice(0, 32);
        const sigBuf = await crypto.subtle.sign('Ed25519', privKey, hash);
        const signature = buf2hex(new Uint8Array(sigBuf));

        const res = await fetch(API + '/posts/' + encodeURIComponent(postId), {
          method: 'DELETE',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ authorId: userId, challenge, signature }),
        });

        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.error || 'Delete failed');
        }

        const result = await res.json();
        console.log('Post deleted:', result);
        if (threadPostId) {
          // If the deleted post was the thread target, go back to feed
          if (threadPostId === postId) window.history.back();
          else loadThread(threadPostId, false);
        } else {
          loadFeed();
        }
      } catch (e) {
        console.error('Delete failed:', e);
        alert('Delete failed: ' + (e.message || 'unknown error'));
        btn.disabled = false;
        btn.textContent = '✕ Delete';
      }
    });
  });
}

function buildCreditTransferTx(creditBoxes, recipientHex, amount) {
  const now = currentBlockHeight;
  const unlocked = creditBoxes.boxes.filter(b =>
    !b.lockedUntilBlock || b.lockedUntilBlock <= currentBlockHeight
  );
  const selected = selectBoxes(unlocked, amount);
  const selectedTotal = selected.reduce((sum, b) => sum + b.value, 0n);
  const change = selectedTotal - amount;

  const outputs = [{
    boxType: 'credit',
    value: amount,
    createdAtBlock: now,
    owner: recipientHex,
    guard: 'owner_signature',
    proofSource: -1,
  }];
  if (change > 0n) {
    outputs.push({
      boxType: 'credit',
      value: change,
      createdAtBlock: now,
      owner: buf2hex(pubKeyRaw),
      guard: 'owner_signature',
      proofSource: -1,
    });
  }

  return {
    inputs: selected.map(b => b.boxId),
    outputs,
    signatures: {},
    protocolVersion: PROTOCOL_VERSION,
  };
}

document.getElementById('creditTransferBtn').addEventListener('click', async () => {
  const btn = document.getElementById('creditTransferBtn');
  const result = document.getElementById('creditTransferResult');
  const recipient = document.getElementById('creditTransferRecipient').value.trim();
  // Input is whole credits; the ledger counts 10⁻⁸-credit base units.
  let amount;
  try { amount = BigInt(document.getElementById('creditTransferAmount').value.trim() || '0') * CREDIT_SCALE; }
  catch { amount = 0n; }

  if (!recipient || recipient.length !== 64) {
    result.innerHTML = '<span class="result-msg err">Recipient must be a 64-character hex user ID</span>';
    return;
  }
  if (amount < 1n) {
    result.innerHTML = '<span class="result-msg err">Amount must be at least 1</span>';
    return;
  }

  btn.disabled = true;
  result.innerHTML = '<span class="result-msg">Building transaction...</span>';

  try {
    const creditBoxes = await fetchCreditBoxes();
    if (!creditBoxes || creditBoxes.total < amount) {
      result.innerHTML = `<span class="result-msg err">Insufficient credits: have ${formatCredits(creditBoxes?.total ?? 0n)}, need ${formatCredits(amount)}</span>`;
      btn.disabled = false;
      return;
    }

    const tx = buildCreditTransferTx(creditBoxes, recipient, amount);
    const { signature } = await signTxId(tx);
    const pubKeyHex = buf2hex(pubKeyRaw);
    tx.signatures[pubKeyHex] = signature;

    // Convert hex signature to base64 for the API
    const sigBytes = hex2buf(signature);
    const sigBase64 = btoa(String.fromCharCode(...sigBytes));

    const res = await fetch(API + '/credits/transfer', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        from: userId,
        to: recipient,
        amount,
        signature: sigBase64,
        expectedHeight: currentBlockHeight,
      }, jsonBigint),
    });

    const data = await res.json();
    if (res.ok) {
      const change = BigInt(data.change);
      result.innerHTML = `<span class="result-msg ok">Sent ${formatCredits(BigInt(data.sent))} credits${change > 0n ? ' (change: ' + formatCredits(change) + ')' : ''}. TxId: ${(data.txId || '').slice(0, 16)}...</span>`;
      loadIdentityStatus();
      loadStatus();
    } else {
      result.innerHTML = `<span class="result-msg err">${esc(data.reason || data.error || 'transfer failed')}</span>`;
    }
  } catch (e) {
    result.innerHTML = `<span class="result-msg err">${esc(e.message)}</span>`;
  } finally {
    btn.disabled = false;
  }
});
