name: E2E Harness
on:
  push:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Run E2E harness
        run: pnpm --filter @dagsocial/node test -- --testPathPattern='e2e/harness' --reporter=verbose
        timeout-minutes: 12
